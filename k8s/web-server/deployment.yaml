apiVersion: apps/v1
kind: Deployment
metadata:
  name: malhaebang-web
  namespace: malhaebang
spec:
  replicas: 2
  selector:
    matchLabels:
      app: malhaebang-web
  template:
    metadata:
      labels:
        app: malhaebang-web
    spec:
      containers:
      - name: malhaebang-web
        image: ${ECR_REGISTRY}/malhaebang-web:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        envFrom:
        - configMapRef:
            name: malhaebang-web-config
        - secretRef:
            name: malhaebang-web-secret
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5 