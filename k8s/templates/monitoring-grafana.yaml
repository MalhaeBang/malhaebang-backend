{{- if .Values.monitoring.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "malhaebang.fullname" . }}-grafana
  labels:
    {{- include "malhaebang.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: {{ .Values.monitoring.grafana.replicaCount }}
  selector:
    matchLabels:
      {{- include "malhaebang.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "malhaebang.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      {{- if .Values.monitoring.grafana.securityContext }}
      securityContext:
        {{- toYaml .Values.monitoring.grafana.securityContext | nindent 8 }}
      {{- end }}
      containers:
      - name: grafana
        image: "{{ .Values.monitoring.grafana.image.repository }}:{{ .Values.monitoring.grafana.image.tag }}"
        imagePullPolicy: {{ .Values.monitoring.grafana.image.pullPolicy }}
        ports:
        - containerPort: 3000
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Admin"
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: "true"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "{{ .Values.monitoring.grafana.adminPassword }}"
        - name: GF_SECURITY_ALLOW_EMBEDDING
          value: "true"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-kubernetes-app"
        - name: GF_SERVER_ROOT_URL
          value: "https://www.malhaebang.site/grafana"
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: "true"
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-config
          mountPath: /etc/grafana/provisioning
        resources:
          {{- toYaml .Values.monitoring.grafana.resources | nindent 10 }}
      volumes:
      - name: grafana-storage
        {{- if .Values.monitoring.grafana.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "malhaebang.fullname" . }}-grafana-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: grafana-config
        configMap:
          name: {{ include "malhaebang.fullname" . }}-grafana-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "malhaebang.fullname" . }}-grafana
  labels:
    {{- include "malhaebang.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: {{ .Values.monitoring.grafana.service.type }}
  ports:
  - port: {{ .Values.monitoring.grafana.service.port }}
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    {{- include "malhaebang.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "malhaebang.fullname" . }}-grafana-config
  labels:
    {{- include "malhaebang.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://{{ include "malhaebang.fullname" . }}-prometheus:{{ .Values.monitoring.prometheus.service.port }}
      isDefault: true
      editable: true

  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards

  malhaebang-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "🏠 MalhaeBang Services Dashboard",
        "tags": ["malhaebang"],
        "style": "dark",
        "timezone": "Asia/Seoul",
        "panels": [
          {
            "id": 1,
            "title": "🟢 Service Status",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=~\"malhaebang-.*\"}",
                "legendFormat": "{{ "{{" }}job{{ "}}" }}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "mappings": [],
                "thresholds": {
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "red", "value": 0},
                    {"color": "green", "value": 1}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "🚀 HTTP Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total{job=~\"malhaebang-.*\"}[5m])",
                "legendFormat": "{{ "{{" }}job{{ "}}" }} - {{ "{{" }}method{{ "}}" }} {{ "{{" }}status{{ "}}" }}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "💾 Memory Usage (%)",
            "type": "graph",
            "targets": [
              {
                "expr": "container_memory_usage_bytes{pod=~\"malhaebang-.*\"} / container_spec_memory_limit_bytes{pod=~\"malhaebang-.*\"} * 100",
                "legendFormat": "{{ "{{" }}pod{{ "}}" }}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "🔥 CPU Usage (%)",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{pod=~\"malhaebang-.*\"}[5m]) * 100",
                "legendFormat": "{{ "{{" }}pod{{ "}}" }}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "5s"
      }
    }

{{- if .Values.monitoring.grafana.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "malhaebang.fullname" . }}-grafana-pvc
  labels:
    {{- include "malhaebang.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.monitoring.grafana.persistence.size }}
  {{- if .Values.monitoring.grafana.persistence.storageClass }}
  storageClassName: {{ .Values.monitoring.grafana.persistence.storageClass }}
  {{- end }}
{{- end }}
{{- end }} 