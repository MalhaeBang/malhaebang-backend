{{- if .Values.nlp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "malhaebang.fullname" . }}-nlp
  labels:
    {{- include "malhaebang.labels" . | nindent 4 }}
    app.kubernetes.io/component: nlp
spec:
  replicas: {{ .Values.nlp.replicaCount }}
  selector:
    matchLabels:
      {{- include "malhaebang.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nlp
  template:
    metadata:
      labels:
        {{- include "malhaebang.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nlp
    spec:
      containers:
        - name: nlp
          image: "{{ .Values.nlp.image.repository }}:{{ .Values.nlp.image.tag }}"
          imagePullPolicy: {{ .Values.nlp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.nlp.service.port }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.nlp.environment }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "malhaebang.fullname" . }}
                  key: MYSQL_PASSWORD
          resources:
            {{- toYaml .Values.nlp.resources | nindent 12 }}
          volumeMounts:
            - name: nlp-data
              mountPath: /app/data
      volumes:
        - name: nlp-data
          persistentVolumeClaim:
            claimName: {{ include "malhaebang.fullname" . }}-nlp-data-pvc
{{- end }} 