{{- if .Values.pricepredict.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "malhaebang.fullname" . }}-pricepredict
  labels:
    {{- include "malhaebang.labels" . | nindent 4 }}
    app.kubernetes.io/component: pricepredict
spec:
  type: {{ .Values.pricepredict.service.type }}
  ports:
    - port: {{ .Values.pricepredict.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "malhaebang.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: pricepredict
{{- end }} 