{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "malhaebang.fullname" . }}-prometheus
  labels:
    {{- include "malhaebang.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: {{ .Values.monitoring.prometheus.replicaCount }}
  selector:
    matchLabels:
      {{- include "malhaebang.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "malhaebang.labels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      containers:
      - name: prometheus
        image: "{{ .Values.monitoring.prometheus.image.repository }}:{{ .Values.monitoring.prometheus.image.tag }}"
        imagePullPolicy: {{ .Values.monitoring.prometheus.image.pullPolicy }}
        ports:
        - containerPort: 9090
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus/'
        - '--web.console.libraries=/usr/share/prometheus/console_libraries'
        - '--web.console.templates=/usr/share/prometheus/consoles'
        - '--web.enable-lifecycle'
        - '--web.route-prefix=/prometheus'
        - '--web.external-url=https://www.malhaebang.site/prometheus'
        - '--web.enable-admin-api'
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/
        - name: prometheus-storage
          mountPath: /prometheus/
        resources:
          {{- toYaml .Values.monitoring.prometheus.resources | nindent 10 }}
      volumes:
      - name: prometheus-config
        configMap:
          name: {{ include "malhaebang.fullname" . }}-prometheus-config
      - name: prometheus-storage
        {{- if .Values.monitoring.prometheus.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "malhaebang.fullname" . }}-prometheus-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "malhaebang.fullname" . }}-prometheus
  labels:
    {{- include "malhaebang.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: {{ .Values.monitoring.prometheus.service.type }}
  ports:
  - port: {{ .Values.monitoring.prometheus.service.port }}
    targetPort: 9090
    protocol: TCP
    name: http
  selector:
    {{- include "malhaebang.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "malhaebang.fullname" . }}-prometheus-config
  labels:
    {{- include "malhaebang.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      # - "first.rules"
      # - "second.rules"

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
        - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https

      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
        - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name

      - job_name: 'malhaebang-web'
        static_configs:
          - targets: ['{{ include "malhaebang.fullname" . }}-web:{{ .Values.web.service.targetPort }}']
        metrics_path: '/actuator/prometheus'
        scrape_interval: 5s

      - job_name: 'malhaebang-nlp'
        static_configs:
          - targets: ['{{ include "malhaebang.fullname" . }}-nlp:{{ .Values.nlp.service.port }}']
        metrics_path: '/metrics'
        scrape_interval: 5s

      - job_name: 'malhaebang-recommend'
        static_configs:
          - targets: ['{{ include "malhaebang.fullname" . }}-recommend:{{ .Values.recommend.service.port }}']
        metrics_path: '/metrics'
        scrape_interval: 5s

      - job_name: 'malhaebang-pricepredict'
        static_configs:
          - targets: ['{{ include "malhaebang.fullname" . }}-pricepredict:{{ .Values.pricepredict.service.port }}']
        metrics_path: '/metrics'
        scrape_interval: 5s

      - job_name: 'malhaebang-saju'
        static_configs:
          - targets: ['{{ include "malhaebang.fullname" . }}-saju:{{ .Values.saju.service.port }}']
        metrics_path: '/metrics'
        scrape_interval: 5s

      - job_name: 'malhaebang-recommendsimilar'
        static_configs:
          - targets: ['{{ include "malhaebang.fullname" . }}-recommendsimilar:{{ .Values.recommendsimilar.service.port }}']
        metrics_path: '/metrics'
        scrape_interval: 5s

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['{{ include "malhaebang.fullname" . }}-node-exporter:9100']
        scrape_interval: 5s

      - job_name: 'cadvisor'
        static_configs:
          - targets: ['{{ include "malhaebang.fullname" . }}-cadvisor:8080']
        scrape_interval: 5s

{{- if .Values.monitoring.prometheus.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "malhaebang.fullname" . }}-prometheus-pvc
  labels:
    {{- include "malhaebang.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.monitoring.prometheus.persistence.size }}
  {{- if .Values.monitoring.prometheus.persistence.storageClass }}
  storageClassName: {{ .Values.monitoring.prometheus.persistence.storageClass }}
  {{- end }}
{{- end }}
{{- end }} 