{{- if .Values.recommendsimilar.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "malhaebang.fullname" . }}-recommendsimilar
  labels:
    {{- include "malhaebang.labels" . | nindent 4 }}
    app.kubernetes.io/component: recommendsimilar
spec:
  type: {{ .Values.recommendsimilar.service.type }}
  ports:
    - port: {{ .Values.recommendsimilar.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "malhaebang.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: recommendsimilar
{{- end }} 