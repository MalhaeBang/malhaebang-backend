{{- if .Values.recommend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "malhaebang.fullname" . }}-recommend
  labels:
    {{- include "malhaebang.labels" . | nindent 4 }}
    app.kubernetes.io/component: recommend
spec:
  type: {{ .Values.recommend.service.type }}
  ports:
    - port: {{ .Values.recommend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "malhaebang.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: recommend
{{- end }} 