<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>임시 비밀번호 안내</title>
</head>
<body style="font-family: 'Apple SD Gothic Neo', 'Segoe UI', sans-serif; background-color: #f8f9fc; padding: 40px 20px; color: #333;">
<div style="max-width: 600px; margin: auto; background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05); overflow: hidden;">

    <!-- 헤더 영역 -->
    <div style="background-color: #ffffff; padding: 30px; border-bottom: 3px solid #4d68ff;">
        <h1 style="font-size: 22px; margin: 0; color: #4d68ff;">MalhaeBang 임시 비밀번호 안내</h1>
    </div>

    <!-- 본문 -->
    <div style="padding: 30px; font-size: 16px; line-height: 1.6;">
        안녕하세요, MalhaeBang입니다.<br><br>
        요청하신 임시 비밀번호는 아래와 같습니다.<br>

        <div style="margin: 20px 0; padding: 12px 16px; background-color: #f4f6fa; border-left: 5px solid #4d68ff; font-size: 20px; font-weight: bold; color: #222; border-radius: 6px; display: inline-block;">
            [[${tempPassword}]]
        </div>
        <br>

        로그인 후 반드시 비밀번호를 변경해 주세요. 보안을 위해 10분 내 사용을 권장드립니다.<br><br>

        감사합니다.
    </div>

    <!-- 푸터 -->
    <div style="padding: 20px; font-size: 12px; text-align: center; color: #999; background-color: #f8f9fc;">
        ⓒ 2025 MalhaeBang. All rights reserved.
    </div>
</div>
</body>
</html>
