<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 찾기 - MalhaeBang</title>

    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/main.css" rel="stylesheet">
    <link href="assets/img/malhaebang/logo_low.png" rel="icon">
    <link href="assets/img/malhaebang/logo_low.png" rel="apple-touch-icon">


    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main.main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 0 60px;
        }

        .findid-container {
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #fff;
            color: #000;
        }

        .findid-container h2 {
            font-weight: bold;
            text-align: left;
            margin-bottom: 20px;
        }

        .findid-container p {
            font-size: 15px;
            color: #444;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
            color: #000;
        }

        .form-control {
            background: none;
            border: none;
            border-bottom: 1px solid #ccc;
            border-radius: 0;
            color: #000;
            padding: 10px 0;
            font-size: 16px;
            height: 40px;
        }

        .form-control:focus {
            background: none;
            border-bottom: 2px solid #000;
            box-shadow: none;
            outline: none;
        }

        ::placeholder {
            color: rgba(0, 0, 0, 0.3);
        }

        .btn-findid {
            width: 100%;
            background: #000;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            border-radius: 12px;
            height: 50px;
            margin-top: 20px;
        }
    </style>
</head>

<body class="index-page">

<!-- 헤더 -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="main">
    <div class="findid-container">
        <h2>아이디 확인</h2>
        <p>회원가입 시 등록한 이메일 주소를 입력해 주세요.<br>가입 여부를 확인 후 비밀번호 재설정을 도와드립니다.</p>

        <form method="post" action="/findid">
            <div class="form-group">
                <label for="email">이메일 주소</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="malhaebang@malhaebang.com" required>
            </div>
            <button type="submit" class="btn btn-primary btn-findid">가입 여부 확인</button>
        </form>

        <!-- 결과 메시지 -->
        <div class="mt-4">
            <p th:if="${emailFound}">
                입력하신 이메일 <strong th:text="${email}"></strong>은 가입된 계정입니다.<br>
                <a th:href="@{/findpassword}">👉 비밀번호를 재설정하시겠어요?</a>
            </p>
            <p th:if="${emailFound == false}" class="text-danger">
                해당 이메일로 가입된 계정을 찾을 수 없습니다.<br>
                <a th:href="@{/signup}">회원가입 하러 가기</a>
            </p>
        </div>
    </div>
</main>

<!-- 푸터 -->
<!--<footer th:replace="footer :: footer"></footer>-->

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
