<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 - MalhaeBang</title>

    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/main.css" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main.main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 0 60px;
        }

        .findpw-container {
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #fff;
            color: #000;
        }

        .findpw-container h2 {
            font-weight: bold;
            text-align: left;
            margin-bottom: 20px;
        }

        .findpw-container p {
            font-size: 15px;
            color: #444;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
            color: #000;
        }

        .form-control {
            background: none;
            border: none;
            border-bottom: 1px solid #ccc;
            border-radius: 0;
            color: #000;
            padding: 10px 0;
            font-size: 16px;
            height: 40px;
        }

        .form-control:focus {
            background: none;
            border-bottom: 2px solid #000;
            box-shadow: none;
            outline: none;
        }

        ::placeholder {
            color: rgba(0, 0, 0, 0.3);
        }

        .btn-findpw {
            width: 100%;
            background: #000;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            border-radius: 12px;
            height: 50px;
            margin-top: 20px;
        }
    </style>
</head>

<body class="index-page">

<!-- 헤더 -->
<div th:replace="header :: header"></div>

<main class="main">
    <div class="findpw-container">
        <h2>비밀번호 찾기</h2>
        <p>본인 인증 완료 후, 휴대폰으로 임시 비밀번호를 발송해 드립니다.<br>비밀번호를 확인할 이메일 주소를 입력해주세요.</p>

        <form method="post" action="/findpassword">

            <div class="form-group">
                <label for="email">이메일 주소</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="malhaebang@malhaebang.com" required>
            </div>

            <button type="submit" class="btn btn-primary btn-findpw">임시 비밀번호 발송하기</button>

        </form>
    </div>
</main>

<!-- 푸터 -->
<footer th:replace="footer :: footer"></footer>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
