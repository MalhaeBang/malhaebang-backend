<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - MalhaeBang</title>

    <!-- Vendor CSS -->
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/main.css" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main.main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 100px 0 60px;
        }

        .signup-container {
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #fff;
            color: #000;
        }

        .signup-container h2 {
            color: #000;
            font-weight: bold;
            text-align: left;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
            color: #000;
        }

        .form-control {
            background: none;
            border: none;
            border-bottom: 1px solid #ccc;
            border-radius: 0;
            color: #000;
            padding: 10px 0;
            font-size: 16px;
        }

        ::placeholder {
            color: rgba(0, 0, 0, 0.3);
        }

        .info-text {
            margin-top: 4px;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.5);
        }

        .btn-signup {
            margin-top: 30px;
            width: 100%;
            background: #000;
            color: #fff;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
        }

        .verify-btn {
            background: #000;
            color: #fff;
            border-radius: 12px;
            position: absolute;
            right: 0;
            top: 0px;
            padding: 5px 12px;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }


    </style>
</head>

<body class="index-page">

<!-- 헤더 -->
<div th:replace="header :: header"></div>

<main class="main">
    <div class="signup-container">
        <h2>반가워요.</h2>

        <form method="post" action="/signup">

            <div class="form-group d-flex align-items-center">
                <label for="id">ID:</label>
                <input type="text" class="form-control flex-grow-1" id="id" name="id" placeholder="malhaebang@malhaebang.com" required>
                <button type="button" class="verify-btn" onclick="alert('이메일 인증은 아직 구현되지 않았습니다.')">이메일 인증</button>
            </div>

            <div class="form-group">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label for="name" style="white-space: nowrap;">이름:</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
            </div>

            <div class="form-group">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label for="password" style="white-space: nowrap;">비밀번호:</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="info-text">(영문 대소문자/숫자/특수문자 중 2가지 이상 조합, 8자 이상)</div>
            </div>

            <div class="form-group">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label for="passwordConfirm" style="white-space: nowrap;">비밀번호 확인:</label>
                    <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-signup">회원가입</button>

        </form>

    </div>
</main>

<!-- 푸터 -->
<footer th:replace="footer :: footer"></footer>

<!-- JS -->
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
