<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - MalhaeBang</title>

    <!-- Vendor CSS -->
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/main.css" rel="stylesheet">
    <link href="assets/img/malhaebang/logo_low.png" rel="icon">
    <link href="assets/img/malhaebang/logo_low.png" rel="apple-touch-icon">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 50%, #ffffff 100%);
            background-attachment: fixed;
            color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* 배경 파티클 효과 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(108, 117, 125, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        main.main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            z-index: 2;
            position: relative;
            min-height: calc(100vh - 80px);
        }

        .signup-container {
            width: 100%;
            max-width: 520px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transform: translateY(20px);
            opacity: 0;
            animation: slideInUp 1s ease-out forwards;
        }

        @keyframes slideInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 47px;
            font-weight: bold;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #495057 0%, #212529 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 5px;
        }

        .logo-subtitle {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6c757d;
            text-align: center;
            margin-bottom: 35px;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .welcome-message {
            font-size: 28px;
            font-weight: bold;
            color: #212529;
            margin-bottom: 35px;
            text-align: left;
            animation: slideInLeft 1s ease-out;
        }

        @keyframes slideInLeft {
            from { 
                transform: translateX(-50px);
                opacity: 0;
            }
            to { 
                transform: translateX(0);
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
            animation: slideInUp 1.2s ease-out;
        }

        .form-group:nth-child(2) { animation-delay: 0.1s; }
        .form-group:nth-child(3) { animation-delay: 0.2s; }
        .form-group:nth-child(4) { animation-delay: 0.3s; }
        .form-group:nth-child(5) { animation-delay: 0.4s; }

        .form-label {
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            color: #495057;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid rgba(108, 117, 125, 0.2);
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 16px;
            color: #333;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 1);
            border: 2px solid #495057;
            box-shadow: 0 0 0 3px rgba(73, 80, 87, 0.1);
            outline: none;
            transform: translateY(-2px) scale(1.01);
        }

        .form-control::placeholder {
            color: rgba(108, 117, 125, 0.6);
            font-style: italic;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .input-group .form-label {
            white-space: nowrap;
            margin-bottom: 0;
            min-width: 100px;
        }

        .input-group .form-control {
            flex: 1;
            min-width: 200px;
        }

        .info-text {
            margin-top: 8px;
            font-size: 13px;
            color: #6c757d;
            font-style: italic;
            padding-left: 5px;
            opacity: 0;
            animation: fadeIn 2s ease-out forwards;
        }

        .btn-signup {
            width: 100%;
            background: linear-gradient(135deg, #343a40 0%, #212529 100%);
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            margin-top: 30px;
            border-radius: 12px;
            height: 55px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: slideInUp 1.5s ease-out;
        }

        .btn-signup::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(52, 58, 64, 0.3);
        }

        .btn-signup:hover::before {
            left: 100%;
        }

        .btn-signup:active {
            transform: translateY(0);
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .signup-container {
                margin: 20px;
                padding: 30px 25px;
            }

            .logo-title {
                font-size: 32px;
            }

            .welcome-message {
                font-size: 24px;
            }

            .input-group {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .input-group .form-label {
                min-width: auto;
            }

            .input-group .form-control {
                min-width: auto;
            }

            .btn-verify {
                min-width: auto;
                width: 100%;
                margin-top: 8px;
            }
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 25px 20px;
            }

            .logo-title {
                font-size: 28px;
            }

            .welcome-message {
                font-size: 22px;
            }

            .form-control, .btn-signup {
                height: 50px;
                font-size: 15px;
            }
        }

        /* 로딩 스피너 */
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff40;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 성공/에러 메시지 애니메이션 */
        .alert-message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .alert-message.show {
            transform: translateX(0);
        }

        .alert-success {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .alert-error {
            background: linear-gradient(135deg, #f44336, #da190b);
        }

        /* 입력 유효성 체크 */
        .form-control.valid {
            border-color: #28a745;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.1);
        }

        .form-control.invalid {
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.1);
        }

        .validation-message {
            font-size: 12px;
            margin-top: 5px;
            padding-left: 5px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .validation-message.show {
            opacity: 1;
        }

        .validation-message.success {
            color: #28a745;
        }

        .validation-message.error {
            color: #dc3545;
        }

        .btn-verify {
            background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            min-width: 100px;
            height: 47px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-verify:hover {
            background: linear-gradient(135deg, #138496 0%, #0f6674 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(23, 162, 184, 0.3);
        }

        .btn-verify:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .verify-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff40;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .verification-status {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }

        .verification-status.pending {
            background: rgba(255, 193, 7, 0.1);
            color: #856404;
            border: 1px solid rgba(255, 193, 7, 0.3);
            display: block;
        }

        .verification-status.verified {
            background: rgba(40, 167, 69, 0.1);
            color: #155724;
            border: 1px solid rgba(40, 167, 69, 0.3);
            display: block;
        }

        .verification-status.failed {
            background: rgba(220, 53, 69, 0.1);
            color: #721c24;
            border: 1px solid rgba(220, 53, 69, 0.3);
            display: block;
        }
    </style>
</head>

<body class="index-page">

<!-- 배경 파티클 효과 -->
<div class="particles" id="particles"></div>

<!-- 헤더 -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="main">
    <div class="signup-container">

        <!-- 로고 섹션 -->
        <h2 class="logo-title">MalHaeBang</h2>
        <h3 class="logo-subtitle">말로 찾는 나만의 공간</h3>

        <!-- 환영 메시지 -->
        <div class="welcome-message">반가워요.</div>

        <!-- 성공/에러 메시지 -->
        <div th:if="${success}" class="alert alert-success" role="alert">
            <strong>회원가입 완료!</strong><br>
            <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <strong>오류:</strong> <span th:text="${error}"></span>
        </div>

        <form method="post" action="/signup" id="signupForm">

            <div class="form-group">
                <div class="input-group">
                    <label for="id" class="form-label">ID:</label>
                    <input type="text" class="form-control" id="id" name="id" placeholder="malhaebang@naver.com" required>
                    <button type="button" class="btn btn-verify" id="verifyEmailBtn" onclick="sendVerification()">
                        <span class="verify-text">인증하기</span>
                        <div class="verify-spinner"></div>
                    </button>
                </div>
                <div class="validation-message" id="idValidation"></div>
                <div class="verification-status" id="verificationStatus"></div>
                
                <!-- 인증번호 입력 필드 (숨김 상태) -->
                <div id="verificationCodeInput" style="display: none; margin-top: 15px;">
                    <div class="input-group">
                        <label for="verificationCode" class="form-label">인증번호:</label>
                        <input type="text" class="form-control" id="verificationCode" placeholder="6자리 인증번호 입력" maxlength="6" pattern="[0-9]{6}">
                        <button type="button" class="btn btn-verify" id="verifyCodeBtn" onclick="verifyCode()">확인</button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="input-group">
                    <label for="name" class="form-label">이름:</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="홍길동" required>
                </div>
                <div class="validation-message" id="nameValidation"></div>
            </div>

            <div class="form-group">
                <div class="input-group">
                    <label for="password" class="form-label">비밀번호:</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="안전한 비밀번호를 입력하세요" required>
                </div>
                <div class="info-text">(영문 대소문자/숫자/특수문자 중 2가지 이상 조합, 8자 이상)</div>
                <div class="validation-message" id="passwordValidation"></div>
            </div>

            <div class="form-group">
                <div class="input-group">
                    <label for="passwordConfirm" class="form-label">비밀번호 확인:</label>
                    <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm" placeholder="비밀번호를 다시 입력하세요" required>
                </div>
                <div class="validation-message" id="passwordConfirmValidation"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-signup">
                <span class="btn-text">회원가입</span>
                <div class="loading-spinner"></div>
            </button>

        </form>

    </div>
</main>

<!-- Vendor JS -->
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>

<script>
    // 파티클 생성
    function createParticles() {
        const particles = document.getElementById('particles');
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 5 + 1;
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            const duration = Math.random() * 3 + 3;
            
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.animationDuration = duration + 's';
            particle.style.animationDelay = Math.random() * 2 + 's';
            
            particles.appendChild(particle);
        }
    }

    // 알림 메시지 표시
    function showAlert(message, type = 'error') {
        const alert = document.createElement('div');
        alert.className = `alert-message alert-${type}`;
        alert.textContent = message;
        document.body.appendChild(alert);
        
        setTimeout(() => alert.classList.add('show'), 100);
        
        setTimeout(() => {
            alert.classList.remove('show');
            setTimeout(() => document.body.removeChild(alert), 300);
        }, 3000);
    }

    // 유효성 검사 함수들
    function validateEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }

    function validatePassword(password) {
        // 영문 대소문자/숫자/특수문자 중 2가지 이상 조합, 8자 이상
        const hasLetter = /[a-zA-Z]/.test(password);
        const hasNumber = /\d/.test(password);
        const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
        const hasMinLength = password.length >= 8;
        
        const criteriaCount = [hasLetter, hasNumber, hasSpecial].filter(Boolean).length;
        return hasMinLength && criteriaCount >= 2;
    }

    function showValidation(elementId, message, isValid) {
        const validationEl = document.getElementById(elementId);
        const inputEl = document.getElementById(elementId.replace('Validation', ''));
        
        validationEl.textContent = message;
        validationEl.className = `validation-message show ${isValid ? 'success' : 'error'}`;
        inputEl.className = `form-control ${isValid ? 'valid' : 'invalid'}`;
    }

    // 이메일 인증 상태 관리
    let emailVerificationStatus = {
        isRequested: false,
        isVerified: false,
        email: null
    };

    // 인증번호 발송 함수
    function sendVerification() {
        const email = document.getElementById('id').value;
        const verifyBtn = document.getElementById('verifyEmailBtn');
        const verifyText = verifyBtn.querySelector('.verify-text');
        const verifySpinner = verifyBtn.querySelector('.verify-spinner');
        const statusDiv = document.getElementById('verificationStatus');
        
        if (!email) {
            showAlert("이메일을 입력해 주세요.", 'error');
            return;
        }

        if (!validateEmail(email)) {
            showAlert("올바른 이메일 형식을 입력해 주세요.", 'error');
            return;
        }

        // 로딩 상태
        verifyText.textContent = '발송 중...';
        verifySpinner.style.display = 'inline-block';
        verifyBtn.disabled = true;

        fetch('/verify-email', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email })
        })
        .then(response => response.text())
        .then(message => {
            // 인증번호 발송 성공
            emailVerificationStatus.isRequested = true;
            emailVerificationStatus.email = email;
            
            verifyText.textContent = '재발송';
            verifySpinner.style.display = 'none';
            verifyBtn.disabled = false;
            
            statusDiv.className = 'verification-status pending';
            statusDiv.innerHTML = '인증번호가 발송되었습니다. 이메일을 확인하여 아래에 입력해주세요.';
            
            // 인증번호 입력 필드 표시
            showVerificationCodeInput();
            
            showAlert("인증번호가 전송되었습니다. 이메일을 확인해 주세요.", 'success');
        })
        .catch(error => {
            console.error('인증번호 발송 오류:', error);
            
            verifyText.textContent = '인증하기';
            verifySpinner.style.display = 'none';
            verifyBtn.disabled = false;
            
            statusDiv.className = 'verification-status failed';
            statusDiv.innerHTML = '인증번호 발송에 실패했습니다. 다시 시도해주세요.';
            
            showAlert("인증번호 전송에 실패했습니다.", 'error');
        });
    }

    // 인증번호 입력 필드 표시
    function showVerificationCodeInput() {
        const verifyCodeDiv = document.getElementById('verificationCodeInput');
        if (verifyCodeDiv) {
            verifyCodeDiv.style.display = 'block';
        }
    }

    // 인증번호 확인
    function verifyCode() {
        const email = document.getElementById('id').value;
        const code = document.getElementById('verificationCode').value;
        const verifyCodeBtn = document.getElementById('verifyCodeBtn');
        
        if (!code || code.length !== 6) {
            showAlert("6자리 인증번호를 입력해주세요.", 'error');
            return;
        }

        verifyCodeBtn.disabled = true;
        verifyCodeBtn.textContent = '확인 중...';

        fetch('/verify-code', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email, code })
        })
        .then(response => response.text())
        .then(message => {
            emailVerificationStatus.isVerified = true;
            
            const statusDiv = document.getElementById('verificationStatus');
            statusDiv.className = 'verification-status verified';
            statusDiv.innerHTML = '✅ 이메일 인증이 완료되었습니다!';
            
            const verifyBtn = document.getElementById('verifyEmailBtn');
            verifyBtn.querySelector('.verify-text').textContent = '인증완료';
            verifyBtn.disabled = true;
            verifyBtn.style.background = '#28a745';
            
            // 인증번호 입력 필드 숨기기
            document.getElementById('verificationCodeInput').style.display = 'none';
            
            // 회원가입 버튼 활성화
            enableSignupButton();
            
            showAlert("이메일 인증이 완료되었습니다!", 'success');
        })
        .catch(error => {
            console.error('인증번호 확인 오류:', error);
            verifyCodeBtn.disabled = false;
            verifyCodeBtn.textContent = '확인';
            showAlert("인증번호가 일치하지 않습니다.", 'error');
        });
    }

    // 회원가입 버튼 활성화
    function enableSignupButton() {
        const signupBtn = document.querySelector('.btn-signup');
        signupBtn.disabled = false;
        signupBtn.style.opacity = '1';
        signupBtn.style.cursor = 'pointer';
    }

    // 페이지 로드 시 회원가입 버튼 비활성화
    document.addEventListener('DOMContentLoaded', function() {
        const signupBtn = document.querySelector('.btn-signup');
        signupBtn.disabled = true;
        signupBtn.style.opacity = '0.5';
        signupBtn.style.cursor = 'not-allowed';
    });

    // 이메일 필드 변경 시 인증 상태 초기화
    document.getElementById('id').addEventListener('input', function() {
        const currentEmail = this.value;
        
        // 이메일이 변경되면 인증 상태 초기화
        if (emailVerificationStatus.email && emailVerificationStatus.email !== currentEmail) {
            emailVerificationStatus.isRequested = false;
            emailVerificationStatus.isVerified = false;
            emailVerificationStatus.email = null;
            
            const verifyBtn = document.getElementById('verifyEmailBtn');
            verifyBtn.querySelector('.verify-text').textContent = '인증하기';
            verifyBtn.disabled = false;
            verifyBtn.style.background = '';
            
            const statusDiv = document.getElementById('verificationStatus');
            statusDiv.className = 'verification-status';
            statusDiv.style.display = 'none';
        }
        
        // 기존 이메일 유효성 검사
        const email = this.value;
        if (email) {
            if (validateEmail(email)) {
                showValidation('idValidation', '✓ 올바른 이메일 형식입니다', true);
            } else {
                showValidation('idValidation', '✗ 올바른 이메일 형식을 입력해주세요', false);
            }
        } else {
            document.getElementById('idValidation').className = 'validation-message';
            this.className = 'form-control';
        }
    });

    // 나머지 필드들의 실시간 유효성 검사
    document.getElementById('name').addEventListener('input', function() {
        const name = this.value.trim();
        if (name) {
            if (name.length >= 2) {
                showValidation('nameValidation', '✓ 올바른 이름입니다', true);
            } else {
                showValidation('nameValidation', '✗ 이름은 2자 이상 입력해주세요', false);
            }
        } else {
            document.getElementById('nameValidation').className = 'validation-message';
            this.className = 'form-control';
        }
    });

    document.getElementById('password').addEventListener('input', function() {
        const password = this.value;
        if (password) {
            if (validatePassword(password)) {
                showValidation('passwordValidation', '✓ 안전한 비밀번호입니다', true);
            } else {
                showValidation('passwordValidation', '✗ 영문/숫자/특수문자 중 2가지 이상, 8자 이상 필요', false);
            }
        } else {
            document.getElementById('passwordValidation').className = 'validation-message';
            this.className = 'form-control';
        }
        
        // 비밀번호 확인도 다시 검사
        const confirmPassword = document.getElementById('passwordConfirm').value;
        if (confirmPassword) {
            document.getElementById('passwordConfirm').dispatchEvent(new Event('input'));
        }
    });

    document.getElementById('passwordConfirm').addEventListener('input', function() {
        const password = document.getElementById('password').value;
        const confirmPassword = this.value;
        
        if (confirmPassword) {
            if (password === confirmPassword) {
                showValidation('passwordConfirmValidation', '✓ 비밀번호가 일치합니다', true);
            } else {
                showValidation('passwordConfirmValidation', '✗ 비밀번호가 일치하지 않습니다', false);
            }
        } else {
            document.getElementById('passwordConfirmValidation').className = 'validation-message';
            this.className = 'form-control';
        }
    });

    // 폼 제출 처리
    document.getElementById('signupForm').addEventListener('submit', function(e) {
        const button = this.querySelector('.btn-signup');
        const buttonText = button.querySelector('.btn-text');
        const spinner = button.querySelector('.loading-spinner');
        
        // 최종 유효성 검사
        const email = document.getElementById('id').value;
        const name = document.getElementById('name').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('passwordConfirm').value;
        
        if (!validateEmail(email)) {
            e.preventDefault();
            showAlert('올바른 이메일을 입력해주세요.', 'error');
            return;
        }
        
        if (name.length < 2) {
            e.preventDefault();
            showAlert('이름은 2자 이상 입력해주세요.', 'error');
            return;
        }
        
        if (!validatePassword(password)) {
            e.preventDefault();
            showAlert('비밀번호 조건을 확인해주세요.', 'error');
            return;
        }
        
        if (password !== confirmPassword) {
            e.preventDefault();
            showAlert('비밀번호가 일치하지 않습니다.', 'error');
            return;
        }
        
        // 로딩 상태 표시
        buttonText.textContent = '회원가입 중...';
        spinner.style.display = 'inline-block';
        button.disabled = true;
        
        // 실제 제출은 계속 진행
    });

    // 입력 필드 애니메이션
    document.querySelectorAll('.form-control').forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
        });
        
        input.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
    });

    // 페이지 로드 시 초기화
    window.addEventListener('load', function() {
        createParticles();
    });

    // 반응형 파티클 재조정
    window.addEventListener('resize', function() {
        const particles = document.getElementById('particles');
        particles.innerHTML = '';
        createParticles();
    });
</script>

</body>
</html>
