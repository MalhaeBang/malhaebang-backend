<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
    <link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link href="assets/img/malhaebang/logo_low.png" rel="icon">
    <link href="assets/img/malhaebang/logo_low.png" rel="apple-touch-icon">

</head>
<body class="index-page">
<div th:replace="~{fragments/header :: header}"></div>

<main class="container mt-5" style="min-height: calc(100vh - 300px);">
    <h2>비밀번호 변경</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- 비밀번호 변경 폼 -->
    <form th:action="@{/changepassword}" method="post">
        <div class="mb-3">
            <label for="currentPassword" class="form-label">현재 비밀번호</label>
            <input type="password" class="form-control" id="currentPassword" name="currentPassword" required>
        </div>
        <div class="mb-3">
            <label for="newPassword" class="form-label">새 비밀번호</label>
            <input type="password" class="form-control" id="newPassword" name="newPassword" required>
        </div>
        <button type="submit" class="btn btn-primary">비밀번호 변경</button>
    </form>
</main>

<!--<footer th:replace="footer :: footer"></footer>-->
</body>
</html>
