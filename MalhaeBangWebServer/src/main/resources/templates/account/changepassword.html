<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경 - MalhaeBang</title>
    
    <!-- Vendor CSS -->
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/main.css" rel="stylesheet">
    <link href="assets/img/malhaebang/logo_low.png" rel="icon">
    <link href="assets/img/malhaebang/logo_low.png" rel="apple-touch-icon">
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 50%, #ffffff 100%);
            background-attachment: fixed;
            color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* 배경 파티클 효과 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(108, 117, 125, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        main.main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            z-index: 2;
            position: relative;
            min-height: calc(100vh - 80px);
        }

        .changepassword-container {
            width: 100%;
            max-width: 520px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transform: translateY(20px);
            opacity: 0;
            animation: slideInUp 1s ease-out forwards;
        }

        @keyframes slideInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 47px;
            font-weight: bold;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #495057 0%, #212529 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 5px;
        }

        .logo-subtitle {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6c757d;
            text-align: center;
            margin-bottom: 35px;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .welcome-message {
            font-size: 28px;
            font-weight: bold;
            color: #212529;
            margin-bottom: 35px;
            text-align: left;
            animation: slideInLeft 1s ease-out;
        }

        @keyframes slideInLeft {
            from { 
                transform: translateX(-50px);
                opacity: 0;
            }
            to { 
                transform: translateX(0);
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
            animation: slideInUp 1.2s ease-out;
        }

        .form-group:nth-child(2) { animation-delay: 0.1s; }
        .form-group:nth-child(3) { animation-delay: 0.2s; }
        .form-group:nth-child(4) { animation-delay: 0.3s; }

        .form-label {
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            color: #495057;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid rgba(108, 117, 125, 0.2);
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 16px;
            color: #333;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 1);
            border: 2px solid #495057;
            box-shadow: 0 0 0 3px rgba(73, 80, 87, 0.1);
            outline: none;
            transform: translateY(-2px) scale(1.01);
        }

        .form-control::placeholder {
            color: rgba(108, 117, 125, 0.6);
            font-style: italic;
        }

        .info-text {
            margin-top: 8px;
            font-size: 13px;
            color: #6c757d;
            font-style: italic;
            padding-left: 5px;
            opacity: 0;
            animation: fadeIn 2s ease-out forwards;
        }

        .btn-change {
            width: 100%;
            background: linear-gradient(135deg, #343a40 0%, #212529 100%);
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            margin-top: 30px;
            border-radius: 12px;
            height: 55px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: slideInUp 1.5s ease-out;
        }

        .btn-change::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-change:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(52, 58, 64, 0.3);
        }

        .btn-change:hover::before {
            left: 100%;
        }

        .btn-change:active {
            transform: translateY(0);
        }

        .btn-back {
            width: 100%;
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            border-radius: 12px;
            height: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 117, 125, 0.3);
            color: #fff;
            text-decoration: none;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .changepassword-container {
                margin: 20px;
                padding: 30px 25px;
            }

            .logo-title {
                font-size: 32px;
            }

            .welcome-message {
                font-size: 24px;
            }

            .btn-change, .btn-back {
                height: 50px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .changepassword-container {
                padding: 25px 20px;
            }

            .logo-title {
                font-size: 28px;
            }

            .welcome-message {
                font-size: 22px;
            }

            .form-control, .btn-change, .btn-back {
                height: 50px;
                font-size: 15px;
            }
        }

        /* 로딩 스피너 */
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff40;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 성공/에러 메시지 애니메이션 */
        .alert-message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .alert-message.show {
            transform: translateX(0);
        }

        .alert-success {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .alert-error {
            background: linear-gradient(135deg, #f44336, #da190b);
        }

        /* 입력 유효성 체크 */
        .form-control.valid {
            border-color: #28a745;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.1);
        }

        .form-control.invalid {
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.1);
        }

        .validation-message {
            font-size: 12px;
            margin-top: 5px;
            padding-left: 5px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .validation-message.show {
            opacity: 1;
        }

        .validation-message.success {
            color: #28a745;
        }

        .validation-message.error {
            color: #dc3545;
        }

        /* 기존 Bootstrap 알림 스타일 개선 */
        .alert {
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            border: none;
            font-weight: 600;
            animation: slideInDown 0.5s ease-out;
        }

        @keyframes slideInDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .alert-danger {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
        }

        .alert-success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
        }
    </style>
</head>

<body class="index-page">

<!-- 배경 파티클 효과 -->
<div class="particles" id="particles"></div>

<!-- 헤더 -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="main">
    <div class="changepassword-container">

        <!-- 로고 섹션 -->
        <h2 class="logo-title">MalHaeBang</h2>
        <h3 class="logo-subtitle">말로 찾는 나만의 공간</h3>

        <!-- 환영 메시지 -->
        <div class="welcome-message">비밀번호 변경</div>

        <!-- 성공/에러 메시지 -->
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <strong>오류:</strong> <span th:text="${error}"></span>
        </div>
        <div th:if="${success}" class="alert alert-success" role="alert">
            <strong>성공:</strong> <span th:text="${success}"></span>
        </div>

        <form th:action="@{/changepassword}" method="post" id="changePasswordForm">

            <div class="form-group">
                <label for="currentPassword" class="form-label">현재 비밀번호</label>
                <input type="password" class="form-control" id="currentPassword" name="currentPassword" placeholder="현재 비밀번호를 입력하세요" required>
                <div class="validation-message" id="currentPasswordValidation"></div>
            </div>

            <div class="form-group">
                <label for="newPassword" class="form-label">새 비밀번호</label>
                <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="새로운 비밀번호를 입력하세요" required>
                <div class="info-text">(영문 대소문자/숫자/특수문자 중 2가지 이상 조합, 8자 이상)</div>
                <div class="validation-message" id="newPasswordValidation"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">새 비밀번호 확인</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="새 비밀번호를 다시 입력하세요" required>
                <div class="validation-message" id="confirmPasswordValidation"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-change">
                <span class="btn-text">비밀번호 변경</span>
                <div class="loading-spinner"></div>
            </button>

        </form>

        <a href="/mypage" class="btn btn-back">마이페이지로 돌아가기</a>

    </div>
</main>

<!-- Vendor JS -->
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>

<script>
    // 파티클 생성
    function createParticles() {
        const particles = document.getElementById('particles');
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 5 + 1;
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            const duration = Math.random() * 3 + 3;
            
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.animationDuration = duration + 's';
            particle.style.animationDelay = Math.random() * 2 + 's';
            
            particles.appendChild(particle);
        }
    }

    // 알림 메시지 표시
    function showAlert(message, type = 'error') {
        const alert = document.createElement('div');
        alert.className = `alert-message alert-${type}`;
        alert.textContent = message;
        document.body.appendChild(alert);
        
        setTimeout(() => alert.classList.add('show'), 100);
        
        setTimeout(() => {
            alert.classList.remove('show');
            setTimeout(() => document.body.removeChild(alert), 300);
        }, 3000);
    }

    // 유효성 검사 함수들
    function validatePassword(password) {
        // 영문 대소문자/숫자/특수문자 중 2가지 이상 조합, 8자 이상
        const hasLetter = /[a-zA-Z]/.test(password);
        const hasNumber = /\d/.test(password);
        const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
        const hasMinLength = password.length >= 8;
        
        const criteriaCount = [hasLetter, hasNumber, hasSpecial].filter(Boolean).length;
        return hasMinLength && criteriaCount >= 2;
    }

    function showValidation(elementId, message, isValid) {
        const validationEl = document.getElementById(elementId);
        const inputEl = document.getElementById(elementId.replace('Validation', ''));
        
        validationEl.textContent = message;
        validationEl.className = `validation-message show ${isValid ? 'success' : 'error'}`;
        inputEl.className = `form-control ${isValid ? 'valid' : 'invalid'}`;
    }

    // 실시간 유효성 검사
    document.getElementById('currentPassword').addEventListener('input', function() {
        const password = this.value;
        if (password) {
            if (password.length >= 1) {
                showValidation('currentPasswordValidation', '✓ 현재 비밀번호가 입력되었습니다', true);
            }
        } else {
            document.getElementById('currentPasswordValidation').className = 'validation-message';
            this.className = 'form-control';
        }
    });

    document.getElementById('newPassword').addEventListener('input', function() {
        const password = this.value;
        if (password) {
            if (validatePassword(password)) {
                showValidation('newPasswordValidation', '✓ 안전한 비밀번호입니다', true);
            } else {
                showValidation('newPasswordValidation', '✗ 영문/숫자/특수문자 중 2가지 이상, 8자 이상 필요', false);
            }
        } else {
            document.getElementById('newPasswordValidation').className = 'validation-message';
            this.className = 'form-control';
        }
        
        // 비밀번호 확인도 다시 검사
        const confirmPassword = document.getElementById('confirmPassword').value;
        if (confirmPassword) {
            document.getElementById('confirmPassword').dispatchEvent(new Event('input'));
        }
    });

    document.getElementById('confirmPassword').addEventListener('input', function() {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = this.value;
        
        if (confirmPassword) {
            if (newPassword === confirmPassword) {
                showValidation('confirmPasswordValidation', '✓ 비밀번호가 일치합니다', true);
            } else {
                showValidation('confirmPasswordValidation', '✗ 비밀번호가 일치하지 않습니다', false);
            }
        } else {
            document.getElementById('confirmPasswordValidation').className = 'validation-message';
            this.className = 'form-control';
        }
    });

    // 폼 제출 처리
    document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
        const button = this.querySelector('.btn-change');
        const buttonText = button.querySelector('.btn-text');
        const spinner = button.querySelector('.loading-spinner');
        
        // 최종 유효성 검사
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        if (!currentPassword) {
            e.preventDefault();
            showAlert('현재 비밀번호를 입력해주세요.', 'error');
            return;
        }
        
        if (!validatePassword(newPassword)) {
            e.preventDefault();
            showAlert('새 비밀번호 조건을 확인해주세요.', 'error');
            return;
        }
        
        if (newPassword !== confirmPassword) {
            e.preventDefault();
            showAlert('새 비밀번호가 일치하지 않습니다.', 'error');
            return;
        }
        
        // 로딩 상태 표시
        buttonText.textContent = '변경 중...';
        spinner.style.display = 'inline-block';
        button.disabled = true;
        
        // 실제 제출은 계속 진행
    });

    // 입력 필드 애니메이션
    document.querySelectorAll('.form-control').forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
        });
        
        input.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
    });

    // 페이지 로드 시 초기화
    window.addEventListener('load', function() {
        createParticles();
    });

    // 반응형 파티클 재조정
    window.addEventListener('resize', function() {
        const particles = document.getElementById('particles');
        particles.innerHTML = '';
        createParticles();
    });
</script>

</body>
</html>
