<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <title>Kakao 지도 - 내 주소 ➔ 아파트 길찾기</title>

    <!-- Vendor CSS -->
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <link href="assets/vendor/aos/aos.css" rel="stylesheet" />
    <link href="assets/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" />
    <link href="assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet" />
    <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet" />
    <link href="assets/css/main.css" rel="stylesheet" />

    <style>
        #header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 999;
        }

        body {
            overflow: hidden;
        }

        main.main {
            margin-bottom: 200px;
            padding: 0;
        }

        #map {
            width: 100%;
            height: calc(100vh - 80px);
        }

        #filter-container {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 10px;
        }
        .form-select {
            width: auto;
            min-width: 120px;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #ffffff;
            background-color: #0d0d0d;
            color: #ffffff;
        }
        #house-list-panel .house-item {
            border-bottom: 1px solid #ccc;
            padding: 10px;
            background-color: white;
            cursor: pointer;
        }
        #house-list-panel .house-item:hover {
            background-color: #eaeaea;
        }
        .main.d-flex {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }


        #house-list-panel {
            border-right: 1px solid #ccc;
            height: 100%;
            overflow-y: auto;
        }
        @media (max-width: 768px) {
            .main.d-flex > div:last-child {
                flex-direction: column;
            }

            #house-list-panel {
                width: 100%;
                height: 300px;
            }

            #map {
                height: calc(100vh - 460px); /* 상단 + 목록 패널 */
            }
        }

    </style>
</head>

<body class="index-page">
<!-- 헤더 -->
<header th:replace="~{fragments/header :: header}" class="header fixed-top"></header>
<!-- 본문 -->

<main class="main d-flex" style="flex-direction: column;">
    <!-- 필터 -->
    <div id="filter-container" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px;">
        <!-- 각 select 그대로 -->
        <select id="filter-depositType" class="form-select">
            <option value="" selected disabled hidden>거래방식</option>
            <option value="상관없음">상관없음</option>
        </select>

        <select id="filter-direction" class="form-select">
            <option value="" selected disabled hidden>채광방향</option>
            <option value="상관없음">상관없음</option>
        </select>

        <select id="filter-parking" class="form-select">
            <option value="" selected disabled hidden>주차여부</option>
            <option value="상관없음">상관없음</option>
        </select>

        <select id="filter-gu" class="form-select">
            <option value="" selected disabled hidden>지역구</option>
            <option value="상관없음">상관없음</option>
        </select>

        <select id="filter-dong" class="form-select">
            <option value="" selected disabled hidden>동</option>
            <option value="상관없음">상관없음</option>
        </select>
    </div>

    <!-- 본문 (지도 + 목록) -->
    <div style="display: flex; flex: 1; height: calc(100vh - 160px);">
        <!-- 매물 목록 패널 -->
        <div id="house-list-panel" style="width: 300px; overflow-y: auto; background-color: #f0f0f0;">
            <!-- JS로 목록 삽입 -->
        </div>

        <!-- 지도 -->
        <div id="map" style="flex-grow: 1;"></div>
    </div>
</main>

<!-- 기타 UI -->
<a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center">
    <i class="bi bi-arrow-up-short"></i>
</a>
<div id="preloader"></div>

<!-- Vendor JS -->
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/aos/aos.js"></script>
<script src="assets/vendor/purecounter/purecounter_vanilla.js"></script>
<script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
<script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
<script th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoAppKey}&libraries=services|"></script>
<script src="assets/js/main.js"></script>

<!-- 지도 스크립트 -->
<script>
    const mapContainer = document.getElementById("map");
    const mapOption = {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 5
    };
    const map = new kakao.maps.Map(mapContainer, mapOption);
    const geocoder = new kakao.maps.services.Geocoder();
    const infowindows = [];
    let markers = [];
    let polygons = [];
    let userPosition = null;
    let userAddress = null;

    // === 현재 위치 마커 표시 ===
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            userPosition = { lat, lng };

            const userMarker = new kakao.maps.Marker({
                map,
                position: new kakao.maps.LatLng(lat, lng),
                image: new kakao.maps.MarkerImage(
                    "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png",
                    new kakao.maps.Size(24, 35)
                )
            });

            map.setCenter(new kakao.maps.LatLng(lat, lng));

            geocoder.coord2Address(lng, lat, (result, status) => {
                if (status === kakao.maps.services.Status.OK) {
                    userAddress = result[0].address.address_name;
                }
            });
        }, () => {
            alert("위치 정보를 가져올 수 없습니다.");
        });
    }

    kakao.maps.event.addListener(map, "click", () => {
        infowindows.forEach(iw => iw.close());
    });

    function startNavigation(destX, destY, destName) {
        if (!userPosition || !userAddress) {
            alert("현재 위치 정보 또는 주소를 가져올 수 없습니다.");
            return;
        }

        const startX = userPosition.lng;
        const startY = userPosition.lat;
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if (isMobile) {
            window.location.href = `kakaomap://route?sp=${startY},${startX}&ep=${destY},${destX}&by=CAR`;
        } else {
            const url = `https://map.kakao.com/?map_type=TYPE_MAP&target=car&rt=${startX},${startY},${destX},${destY}&rt1=${encodeURIComponent(userAddress)}&rt2=${encodeURIComponent(destName)}&rtIds=,`;
            window.open(url, "_blank");
        }
    }

    function loadFilteredHouses() {
        // 필터 값 읽기
        const depositType = document.getElementById("filter-depositType").value;
        const direction = document.getElementById("filter-direction").value;
        const parking = document.getElementById("filter-parking").value;
        const gu = document.getElementById("filter-gu").value;
        const dong = document.getElementById("filter-dong").value;

        if (!depositType || !direction || !parking || !gu || !dong) {
            // 하나라도 선택되지 않았으면 마커 제거
            markers.forEach(m => m.setMap(null));
            markers = [];
            infowindows.forEach(iw => iw.close());
            infowindows.length = 0;
            return;
        }

        const params = new URLSearchParams();
        if (depositType !== "상관없음") params.append("type", depositType);
        if (direction !== "상관없음") params.append("direction", direction);
        if (parking !== "상관없음") params.append("parking", parking);
        if (gu !== "상관없음") params.append("gu", gu);
        if (dong !== "상관없음") params.append("dong", dong);
        fetch(`/map/houses?${params.toString()}`)
            .then(res => res.json())
            .then(data => {
                // 1. 기존 마커/인포윈도우 제거
                markers.forEach(m => m.setMap(null));
                markers = [];
                infowindows.forEach(iw => iw.close());
                infowindows.length = 0;

                // ✅ 사이드바 초기화
                const listPanel = document.getElementById("house-list-panel");
                listPanel.innerHTML = "";

                // 2. 새 데이터 처리
                data.forEach((apt, idx) => {
                    const coords = new kakao.maps.LatLng(apt.latitude, apt.longitude);
                    const marker = new kakao.maps.Marker({ map, position: coords });
                    markers.push(marker);

                    const infowindow = new kakao.maps.InfoWindow({
                        content: `
                    <div style="padding:10px;font-size:14px;">
                            🏠 ${apt.title}<br>
                            💰 가격: ${apt.price}<br>
                            📍 주소: ${apt.address}<br>
                            📐 면적: ${apt.area}<br>
                            🧭 방향: ${apt.direction}<br>
                            🏢 층수: ${apt.floor}<br>
                            📦 거래 방식: ${apt.depositType}<br>
                            🅿️ 주차: ${apt.parking}<br>
                            💡 관리비: ${apt.mfee}<br>
                            ⏰ 입주 가능일: ${apt.afrom}<br>
                            🧑‍💼 중개사 정보: ${apt.agentInfo}<br>
                            📞 중개 수수료: ${apt.agentComm}<br>
                            🛏 방 개수: ${apt.roomsCnt}<br>
                            🧰 옵션: ${apt.options}<br>
                            📅 등록일: ${apt.postedAt}<br>
                            🏙 지역: ${apt.gu} ${apt.dong}<br>
                            🏠 건물유형: ${apt.buildingType}<br>
                            🏗 준공일: ${apt.builtDate}<br>
                            📝 정보: ${apt.feature}<br>
                            📝 설명: ${apt.explanations}<br><br>
                        <button onclick="startNavigation(${apt.longitude}, ${apt.latitude}, '${apt.address}')">길찾기</button>
                    </div>
                `
                    });

                    infowindows.push(infowindow);
                    kakao.maps.event.addListener(marker, "click", function () {
                        infowindows.forEach(iw => iw.close());
                        infowindow.open(map, marker);
                    });

                    // ✅ 사이드바 목록에 추가
                    const houseDiv = document.createElement("div");
                    houseDiv.className = "house-item";
                    houseDiv.innerHTML = `
                        <strong>${apt.title || ""}</strong><br>
                        💰 가격: ${apt.price || ""}<br>
                        📦 거래 방식: ${apt.depositType || ""}<br>
                        🧭 방향: ${apt.direction || ""}<br>
                        🏢 층수: ${apt.floor || ""}<br>
                    `;
                    houseDiv.onclick = () => {
                        map.panTo(coords);
                        infowindows.forEach(iw => iw.close());
                        infowindow.open(map, marker);
                    };

                    listPanel.appendChild(houseDiv);
                });
            });
    }

    function drawFilteredPolygons(regionName) {
        polygons.forEach(p => p.setMap(null));
        polygons = [];

        fetch('/assets/json/geojson_wgs84.json')
            .then(res => res.json())
            .then(geojson => {
                geojson.features.forEach(feature => {
                    const dongName = feature.properties.EMD_KOR_NM;
                    if (regionName === "전체" || dongName === regionName) {
                        const geometry = feature.geometry;
                        if (geometry.type === 'Polygon') {
                            drawPolygon(geometry.coordinates);
                        } else if (geometry.type === 'MultiPolygon') {
                            geometry.coordinates.forEach(polygonCoords => {
                                drawPolygon(polygonCoords);
                            });
                        }
                    }
                });
            });
    }


    function drawPolygon(coordsArray) {
        coordsArray.forEach(linearRing => {
            const path = linearRing.map(coord => new kakao.maps.LatLng(coord[1], coord[0]));
            const polygon = new kakao.maps.Polygon({
                path,
                strokeWeight: 2,
                strokeColor: '#FF0000',
                strokeOpacity: 0.8,
                fillColor: '#FF0000',
                fillOpacity: 0.3
            });
            polygon.setMap(map);
            polygons.push(polygon);
        });
    }

    function loadFilterOptions() {
        const fillSelect = (id, url) => {
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById(id);
                    const placeholder = {
                        "filter-depositType": "거래방식",
                        "filter-direction": "채광방향",
                        "filter-parking": "주차 여부",
                        "filter-gu": "지역구",
                        "filter-dong": "동"
                    };
                    select.innerHTML = `<option value="" selected disabled hidden>${placeholder[id]}</option>`;
                    select.innerHTML += `<option value="상관없음">상관없음</option>`;
                    data.forEach(item => {
                        const option = document.createElement("option");
                        option.value = item;
                        option.text = item;
                        select.appendChild(option);
                    });
                });
        };

        fillSelect("filter-depositType", "/api/filters/depositType");
        fillSelect("filter-direction", "/api/filters/direction");
        fillSelect("filter-parking", "/api/filters/parking");

        // gu + 동 + 초기 polygon 처리
        fetch("/api/filters/gu")
            .then(res => res.json())
            .then(data => {
                const guSelect = document.getElementById("filter-gu");
                guSelect.innerHTML = '<option value="" selected disabled hidden>지역구</option>';
                data.forEach(item => {
                    const option = document.createElement("option");
                    option.value = item;
                    option.text = item;
                    guSelect.appendChild(option);
                });

                if (data.length > 0) {
                    drawFilteredPolygons("상관없음");

                }
            });
    }

    document.addEventListener("DOMContentLoaded", function () {
        loadFilterOptions();

        document.getElementById("filter-depositType").addEventListener("change", loadFilteredHouses);
        document.getElementById("filter-direction").addEventListener("change", loadFilteredHouses);
        document.getElementById("filter-parking").addEventListener("change", loadFilteredHouses);

        document.getElementById("filter-gu").addEventListener("change", function () {
            const gu = this.value;
            const dongSelect = document.getElementById("filter-dong");
            dongSelect.innerHTML = "<option value='' selected disabled hidden>동</option>";
            if (gu !== "전체") {
                fetch(`/api/filters/dong?gu=${encodeURIComponent(gu)}`)
                    .then(res => res.json())
                    .then(data => {
                        data.forEach(d => {
                            const option = document.createElement("option");
                            option.value = d;
                            option.text = d;
                            dongSelect.appendChild(option);
                        });
                    });
            }

            drawFilteredPolygons(gu);
            loadFilteredHouses();
        });

        document.getElementById("filter-dong").addEventListener("change", function () {
            const dong = this.value;
            drawFilteredPolygons(dong);
            loadFilteredHouses();
        });
    });
</script>
</body>

</html>
