<!-- 지도 스크립트 -->
<script>



    const mapContainer = document.getElementById("map");
    const mapOption = {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 5
    };
    const map = new kakao.maps.Map(mapContainer, mapOption);
    const geocoder = new kakao.maps.services.Geocoder();
    const infowindows = [];
    let clusterer;
    let markers = [];
    let polygons = [];
    let userPosition = null;
    let userAddress = null;
    clusterer = new kakao.maps.MarkerClusterer({
        map: map,
        averageCenter: true,
        minLevel: 5
    });
    // === 현재 위치 마커 표시 ===
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            userPosition = { lat, lng };

            const userMarker = new kakao.maps.Marker({
                map,
                position: new kakao.maps.LatLng(lat, lng),
                image: new kakao.maps.MarkerImage(
                    "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png",
                    new kakao.maps.Size(24, 35)
                )
            });

            map.setCenter(new kakao.maps.LatLng(lat, lng));

            geocoder.coord2Address(lng, lat, (result, status) => {
                if (status === kakao.maps.services.Status.OK) {
                    userAddress = result[0].address.address_name;
                }
            });
        }, () => {
            alert("위치 정보를 가져올 수 없습니다.");
        });
    }

    kakao.maps.event.addListener(map, "click", () => {
        infowindows.forEach(iw => iw.close());
    });

    function startNavigation(destX, destY, destName) {
        if (!userPosition || !userAddress) {
            alert("현재 위치 정보 또는 주소를 가져올 수 없습니다.");
            return;
        }

        const startX = userPosition.lng;
        const startY = userPosition.lat;
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if (isMobile) {
            window.location.href = `kakaomap://route?sp=${startY},${startX}&ep=${destY},${destX}&by=CAR`;
        } else {
            const url = `https://map.kakao.com/?map_type=TYPE_MAP&target=car&rt=${startX},${startY},${destX},${destY}&rt1=${encodeURIComponent(userAddress)}&rt2=${encodeURIComponent(destName)}&rtIds=,`;
            window.open(url, "_blank");
        }
    }

    function loadFilteredHouses() {
        // 필터 값 읽기
        const depositTypeSelect = document.getElementById("filter-depositType");
        const safetyGradeSelect = document.getElementById("filter-safetyGrade");
        const priceSelect = document.getElementById("filter-price");
        const guSelect = document.getElementById("filter-gu");
        const dongSelect = document.getElementById("filter-dong");

        const depositType = depositTypeSelect.value;
        const safetyGrade = safetyGradeSelect.value;
        const priceRange = priceSelect.value;
        const gu = guSelect.value;
        const dong = dongSelect.value;


        // ✅ 모든 필터가 '상관없음'이 아닌지 확인
        if (depositType === "" || depositType === "상관없음" ||
            safetyGrade === "" || safetyGrade === "상관없음" ||
            priceRange === "" || priceRange === "상관없음" ||
            gu === "" || gu === "상관없음" ||
            dong === "" || dong === "상관없음") {
            // 조건 불충족 시 목록 및 마커 초기화
            markers.forEach(m => m.setMap(null));
            markers = [];
            clusterer.clear(); // 클러스터러의 마커도 지워야 합니다.
            infowindows.forEach(iw => iw.close());
            infowindows.length = 0;
            const listPanel = document.getElementById("house-list-panel");
            listPanel.innerHTML = ""; // 사이드바 목록 초기화
            return; // API 호출 없이 종료
        }

        // 모든 필터가 선택되었으면 API 호출 및 결과 처리
        const params = new URLSearchParams();
        // 모든 값이 '상관없음'이 아닌 것을 확인했으므로, 해당 값 그대로 넘깁니다.
        params.append("type", depositType);
        params.append("safetyGrade", safetyGrade);
        params.append("priceRange", priceRange);
        params.append("gu", gu);
        params.append("dong", dong);


        fetch(`/map/houses?${params.toString()}`)
            .then(res => res.json())
            .then(data => {
                // 1. 기존 마커/인포윈도우 제거
                markers.forEach(m => m.setMap(null));
                markers = [];
                clusterer.clear();
                infowindows.forEach(iw => iw.close());
                infowindows.length = 0;
                const newMarkers = [];

                // ✅ 사이드바 초기화
                const listPanel = document.getElementById("house-list-panel");
                listPanel.innerHTML = "";

                // 2. 새 데이터 처리
                data.forEach((apt, idx) => {
                    const coords = new kakao.maps.LatLng(apt.latitude, apt.longitude);

                    // safety_grade에 따른 마커 이미지 설정
                    console.log('Safety Grade:', apt.safetyGrade, 'Type:', typeof apt.safetyGrade);
                    let markerImage;
                    switch(apt.safetyGrade) {
                        case '매우안전':
                            markerImage = new kakao.maps.MarkerImage(
                                "/assets/img/marker/marker_green.png"
                                ,new kakao.maps.Size(39, 45)
                            );
                            break;
                        case '안전':
                            markerImage = new kakao.maps.MarkerImage(
                                "/assets/img/marker/marker_blue.png"
                                ,new kakao.maps.Size(39, 45)
                            );
                            break;
                        case '보통':
                            markerImage = new kakao.maps.MarkerImage(
                                "/assets/img/marker/marker_yellow.png"
                                ,new kakao.maps.Size(39, 45)
                            );
                            break;
                        case '주의':
                            markerImage = new kakao.maps.MarkerImage(
                                "/assets/img/marker/marker_orange.png"
                                ,new kakao.maps.Size(39, 45)
                            );
                            break;
                        case '위험':
                            markerImage = new kakao.maps.MarkerImage(
                                "/assets/img/marker/marker_red.png"
                                ,new kakao.maps.Size(39, 45)
                            );
                            break;
                        default:
                            // 안전지수가 '상관없음'이거나 없는 경우 기본 마커
                            markerImage = new kakao.maps.MarkerImage(
                                "/assets/img/marker/marker_blue.png"
                                ,new kakao.maps.Size(24, 35)
                            );
                    }

                    const marker = new kakao.maps.Marker({
                        map,
                        position: coords,
                        image: markerImage // 안전지수에 따라 설정된 이미지 사용
                    });
                    newMarkers.push(marker);
                    markers.push(marker);

                    const infowindow = new kakao.maps.InfoWindow({
                        content: `
                    <div style="padding:10px;font-size:14px;">
                            🏠 ${apt.title}<br>
                            💰 가격: ${apt.price}<br>
                            📍 주소: ${apt.address}<br>
                            📐 면적: ${apt.areaSize || ''}<br>
                            🧭 방향: ${apt.direction || ''}<br>
                            🏢 층수: ${apt.floor !== undefined && apt.floor !== null ? apt.floor + '층' : ''}<br>
                            📦 거래 방식: ${apt.depositType || ''}<br>
                            🏢 주차: ${apt.parking !== undefined && apt.parking !== null ? (apt.parking === 1 ? '가능' : '불가능') : ''}<br>
                            💡 관리비: ${apt.mFee !== undefined && apt.mFee !== null ? apt.mFee + '만원' : ''}<br>
                            ⏰ 입주 가능일: ${apt.aFrom || ''}<br>
                            🧑‍💼 중개사 정보: ${apt.agentInfo || ''}<br>
                            📞 중개 수수료: ${apt.agentComm !== undefined && apt.agentComm !== null ? apt.agentComm + '만원' : ''}<br>
                            🛏 방 개수: ${apt.roomsCnt || ''}<br>
                            🧰 옵션: ${apt.options || ''}<br>
                            📅 등록일: ${apt.postedAt || ''}<br>
                            🏙 지역: ${apt.gu || ''} ${apt.dong || ''}<br>
                            🏠 건물유형: ${apt.buildingType || ''}<br>
                            🏗 준공일: ${apt.builtDate || ''}<br>
                            📝 정보: ${apt.houseFeature || ''}<br>
                            📝 설명: ${apt.houseExplanations || ''}<br>
                            🛡 안전지수: ${apt.safetyGrade || '정보 없음'}<br><br>
                        <button onclick="startNavigation(${apt.longitude}, ${apt.latitude}, '${apt.address}')">길찾기</button>
                    </div>
                `
                    });

                    infowindows.push(infowindow);
                    kakao.maps.event.addListener(marker, "click", function () {
                        const houseNum = apt.num;
                        const iframe = document.getElementById("iframe-content");
                        const panel = document.getElementById("iframe-sidepanel");
                        // 패널이 이미 열려있는 경우 닫고 다시 열지 않음 (깜빡임 방지)
                        // if (panel.style.display === "block") return; // 필요에 따라 이 라인 사용 가능

                        panel.style.display = "none"; // 일단 닫고
                        iframe.src = ""; // iframe src 비우기

                        // 지연을 주어 부드러운 전환 효과
                        setTimeout(() => {
                             iframe.src = `http://localhost:5003/recommend_ui?house_num=${houseNum}`;
                             panel.style.display = "block";
                        }, 50); // 50ms 지연


                    });

                    // ✅ 사이드바 목록에 추가
                    const houseDiv = document.createElement("div");
                    houseDiv.className = "house-item";

                    // 찜 버튼 생성 + 이벤트 바인딩
                    const starSpan = document.createElement("span");
                    starSpan.className = "favorite-toggle";
                    starSpan.dataset.houseId = apt.houseId;
                    starSpan.innerHTML = `<i class="bi bi-star"></i>`;
                    if (apt.isLiked) {
                        starSpan.querySelector("i").classList.remove("bi-star");
                        starSpan.querySelector("i").classList.add("bi-star-fill");
                    }

                    starSpan.addEventListener("click", function (e) {
                        e.stopPropagation(); // 이벤트 버블링 중지 (아이템 클릭 이벤트와 분리)
                        openFolderSelectModal(apt.houseId);
                    });

                    // 제목 엘리먼트
                    const title = document.createElement("strong");
                    title.textContent = apt.title || "";

                    // 헤더 라인 조립
                    const topLine = document.createElement("div");
                    topLine.className = "topLine";
                    topLine.appendChild(title);
                    topLine.appendChild(starSpan);

                    // 상세 정보
                    const body = document.createElement("div");
                    body.className = "house-info";
                     // apt.price는 "전세 1억 / 월세 50만원" 형태의 문자열
                    body.innerHTML = `
                    💰 가격: ${apt.price || ""}<br>
                    📦 거래 방식: ${apt.depositType || ""}<br>
                    🧭 방향: ${apt.direction || ""}<br>
                    🏢 층수: ${apt.floor !== undefined && apt.floor !== null ? apt.floor + '층' : ''}<br>
                    💡 관리비: ${apt.mFee !== undefined && apt.mFee !== null ? apt.mFee + '만원' : ''}<br>
                    `;

                    // 클릭 시 지도 이동 및 iframe 열기
                    houseDiv.addEventListener("click", () => {
                        map.panTo(coords); // 지도 이동
                        const houseNum = apt.num;
                         const iframe = document.getElementById("iframe-content");
                         const sidePanel = document.getElementById("iframe-sidepanel");

                         // 패널이 이미 열려있고 같은 매물이면 닫기 토글
                         // if (sidePanel.style.display === "block" && iframe.src.includes(`house_num=${houseNum}`)) {
                         //     closeIframe();
                         //     return;
                         // }


                        sidePanel.style.display = "none"; // 일단 닫고
                         iframe.src = ""; // iframe src 비우기

                         // 지연을 주어 부드러운 전환 효과
                         setTimeout(() => {
                             iframe.src = `http://localhost:5003/recommend_ui?house_num=${houseNum}`;
                             sidePanel.style.display = "block";
                         }, 50); // 50ms 지연

                    });

                    // 조립 후 패널에 추가
                    houseDiv.appendChild(topLine);
                    houseDiv.appendChild(body);
                    listPanel.appendChild(houseDiv);
                });
                clusterer.addMarkers(newMarkers);
            });
    }

    function closeIframe() {
        const panel = document.getElementById("iframe-sidepanel");
        panel.style.display = "none";
    }

    function drawFilteredPolygons(regionName) {
        polygons.forEach(p => p.setMap(null));
        polygons = [];

        fetch('/assets/json/geojson_wgs84.json')
            .then(res => res.json())
            .then(geojson => {
                geojson.features.forEach(feature => {
                    const dongName = feature.properties.EMD_KOR_NM;
                    if (regionName === "전체" || dongName === regionName) {
                        const geometry = feature.geometry;
                        if (geometry.type === 'Polygon') {
                            drawPolygon(geometry.coordinates);
                        } else if (geometry.type === 'MultiPolygon') {
                            geometry.coordinates.forEach(polygonCoords => {
                                drawPolygon(polygonCoords);
                            });
                        }
                    }
                });
            });
    }


    function drawPolygon(coordsArray) {
        coordsArray.forEach(linearRing => {
            const path = linearRing.map(coord => new kakao.maps.LatLng(coord[1], coord[0]));
            const polygon = new kakao.maps.Polygon({
                path,
                strokeWeight: 2,
                strokeColor: '#FF0000',
                strokeOpacity: 0.8,
                fillColor: '#FF0000',
                fillOpacity: 0.3
            });
            polygon.setMap(map);
            polygons.push(polygon);
        });
    }

    function loadFilterOptions() {
        const fillSelect = (id, url) => {
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById(id);
                    const placeholder = {
                        "filter-depositType": "거래방식",
                        "filter-safetyGrade": "안전지수",
                        "filter-price": "가격 범위",
                        "filter-gu": "지역구",
                        "filter-dong": "동"
                    };
                    select.innerHTML = `<option value="" selected disabled hidden>${placeholder[id]}</option>`;
                    select.innerHTML += `<option value="상관없음">상관없음</option>`;
                    
                    data.forEach(item => {
                        const option = document.createElement("option");
                        option.value = item;
                        option.text = item;
                        select.appendChild(option);
                    });
                });
        };

        // 거래방식, 안전지수, 지역구 목록 로드
        fillSelect("filter-depositType", "/api/filters/depositType");
        fillSelect("filter-safetyGrade", "/api/filters/safetyGrade");

        // 지역구 로드 및 초기 polygon 그리기
        fetch("/api/filters/gu")
            .then(res => res.json())
            .then(data => {
                const guSelect = document.getElementById("filter-gu");
                guSelect.innerHTML = '<option value="" selected disabled hidden>지역구</option>';
                guSelect.innerHTML += '<option value="상관없음">상관없음</option>';
                data.forEach(item => {
                    const option = document.createElement("option");
                    option.value = item;
                    option.text = item;
                    guSelect.appendChild(option);
                });

                if (data.length > 0) {
                    drawFilteredPolygons("상관없음");
                }
            });
    }

    // 가격 범위 목록을 백엔드에서 가져와서 업데이트하는 함수
    function updatePriceRangeOptions(selectedDepositType) {
        const priceSelect = document.getElementById("filter-price");
        const pricePlaceholder = "가격 범위";

        // API 호출
        fetch(`/api/filters/price?depositType=${encodeURIComponent(selectedDepositType || "전세")}`)
            .then(res => res.json())
            .then(data => {
                priceSelect.innerHTML = `<option value="" selected disabled hidden>${pricePlaceholder}</option>`;
                priceSelect.innerHTML += `<option value="상관없음">상관없음</option>`;

                data.forEach(range => {
                    const option = document.createElement("option");
                    option.value = range; // 예: "1억 이하", "20만원대" 등의 문자열
                    option.text = range;
                    priceSelect.appendChild(option);
                });
                // 가격 범위 드롭다운의 선택값을 초기화합니다.
                priceSelect.value = "";
            });
    }

    document.addEventListener("DOMContentLoaded", function () {
        loadFilterOptions();

        // 초기 로딩 시 거래방식의 기본값에 따라 가격 범위 로드
        const initialDepositTypeSelect = document.getElementById("filter-depositType");
        updatePriceRangeOptions(initialDepositTypeSelect.value || "전세"); // 기본값을 '전세'로 설정

        // 거래방식 변경 시 가격 범위 업데이트 및 매물 로드
        initialDepositTypeSelect.addEventListener("change", function() {
            const selectedType = this.value;
            updatePriceRangeOptions(selectedType); // 가격 범위 목록 업데이트
            loadFilteredHouses(); // 필터 변경 시 매물 다시 로드
        });

        document.getElementById("filter-safetyGrade").addEventListener("change", loadFilteredHouses);
        document.getElementById("filter-price").addEventListener("change", loadFilteredHouses);

        document.getElementById("filter-gu").addEventListener("change", function () {
            const gu = this.value;
            const dongSelect = document.getElementById("filter-dong");
            dongSelect.innerHTML = "<option value='' selected disabled hidden>동</option>";
            dongSelect.innerHTML += '<option value="상관없음">상관없음</option>';
            if (gu !== "상관없음") {
                fetch(`/api/filters/dong?gu=${encodeURIComponent(gu)}`)
                    .then(res => res.json())
                    .then(data => {
                        data.forEach(d => {
                            const option = document.createElement("option");
                            option.value = d;
                            option.text = d;
                            dongSelect.appendChild(option);
                        });
                    });
            }

            drawFilteredPolygons(gu);
            loadFilteredHouses();
        });

        document.getElementById("filter-dong").addEventListener("change", function () {
            const dong = this.value;
            drawFilteredPolygons(dong);
            loadFilteredHouses();
        });
    });




    let selectedFolderId = null;
    let lastHouseId = null;

    function openFolderSelectModal(houseId) {
        lastHouseId = houseId;
        fetch("/api/like/folders")
            .then(res => res.json())
            .then(folders => {
                const list = document.getElementById("folder-list");
                list.innerHTML = "";
                selectedFolderId = null;

                folders.forEach(folder => {
                    const li = document.createElement("li");
                    li.className = "list-group-item list-group-item-action";
                    li.textContent = `${folder.folderName} (ID: ${folder.folderId})`;
                    li.addEventListener("click", () => {
                        list.querySelectorAll(".active").forEach(el => el.classList.remove("active"));
                        li.classList.add("active");
                        selectedFolderId = folder.folderId;
                    });

                    list.appendChild(li);
                });

                // 폴더 없을 때 안내 추가
                if (folders.length === 0) {
                    const li = document.createElement("li");
                    li.className = "list-group-item";
                    li.textContent = "폴더가 없습니다.";
                    list.appendChild(li);
                }

                // 확인 버튼 동작
                document.getElementById("folderConfirmBtn").onclick = () => {
                    if (selectedFolderId) {
                        saveToFolder(houseId, selectedFolderId);

                        const modalElement = document.getElementById("folderSelectModal");
                        const modalInstance = bootstrap.Modal.getInstance(modalElement);
                        modalInstance.hide();

                        // ✅ 회색 백그라운드 제거
                        document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
                        document.body.classList.remove('modal-open');
                        document.body.style.overflow = 'auto';
                    } else {
                        alert("폴더를 선택해주세요.");
                    }
                };

                const modal = new bootstrap.Modal(document.getElementById("folderSelectModal"));
                modal.show();
            });
    }
    function saveToFolder(houseId, folderId) {
        fetch(`/api/like/${houseId}/folder/${folderId}`, {
            method: "POST"
        }).then(res => res.text())
            .then(msg => {
                alert("찜 목록에 추가되었습니다.");
            });
    }

    function createNewFolder() {
        const newFolderName = document.getElementById("newFolderName").value.trim();
        if (!newFolderName) {
            alert("폴더 이름을 입력해주세요.");
            return;
        }

        fetch("/api/like/folder", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ folderName: newFolderName })
        })
            .then(res => {
                if (!res.ok) throw new Error("폴더 생성 실패");
                return res.text();
            })
            .then(msg => {
                alert(msg);
                document.getElementById("newFolderName").value = "";
                openFolderSelectModal(lastHouseId); // 폴더 목록 갱신
            })
            .catch(err => {
                alert("폴더 생성 중 오류가 발생했습니다.");
            });
    }

</script>
