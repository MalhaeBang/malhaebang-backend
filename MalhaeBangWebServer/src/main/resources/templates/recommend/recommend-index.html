<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>대출 추천</title>
    <link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
        }
        .user-bubble {
            background-color: #007bff;
            color: white;
            padding: 10px;
            border-radius: 20px;
            margin-bottom: 15px;
            text-align: right;
        }
        .profile-bubble {
            background-color: #28a745;
            color: white;
            padding: 10px;
            border-radius: 20px;
            margin-bottom: 15px;
        }
        .chat-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .chat-box {
            border: 1px solid #ddd;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .user, .bot {
            margin-bottom: 15px;
        }
        .user {
            color: #007bff;
            text-align: right;
        }
        .bot {
            color: #28a745;
        }
        .bot strong {
            color: #333;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
        }
        .input-group input {
            flex: 1;
            margin-right: 10px;
        }
        .btn-send {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }
        .btn-send:hover {
            background-color: #0056b3;
        }
        .container {
            padding-top: 100px;
        }
    </style>
</head>
<body>
<div th:replace="header :: header"></div>

<div class="container mt-5">
    <h1 class="text-center">대출 추천 시스템</h1>

    <div class="chat-box" id="chat-box">
        <div class="bot">🤖 안녕하세요! 전세 금액과 자금, 프로필 키워드를 입력해 주세요.</div>
    </div>

    <form th:action="@{/recommend}" method="post">
        <div class="form-group">
            <input type="text" class="form-control" id="user_input" name="user_input" placeholder="예: 전세 2억5천, 자금 1억" required th:value="${user_input}">
        </div>

        <div class="form-group">
            <label for="user_profile"><strong>키워드 선택:</strong></label>
            <select class="form-control" id="user_profile" name="user_profile" required>
                <option value="" disabled th:if="${user_profile == null}" selected>선택하세요</option>
                <option th:each="keyword : ${keywords}"
                        th:value="${keyword}"
                        th:text="${keyword}"
                        th:selected="${keyword == user_profile}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">추천 받기</button>
    </form>

    <div th:if="${results != null}" class="mt-4">
        <hr>
        <h2>🤖 추천 대출 상품</h2>
        <div class="alert alert-info">
            <p><strong>보유 자금:</strong> <span th:text="${own_money}"></span>만 원</p>
            <p><strong>희망 전세금:</strong> <span th:text="${rent_price}"></span>만 원</p>
            <p><strong>필요 대출금액:</strong> <span th:text="${required_loan}"></span>만 원</p>
        </div>

        <ul class="list-group">
            <li th:each="loan : ${results}" class="list-group-item">
                <strong th:text="${loan.name}"></strong><br>
                <p><strong>특징:</strong> <span th:text="${loan.feature}"></span></p>
                <p><strong>금리:</strong> <span th:text="${loan.rate}"></span></p>
                <p><strong>한도:</strong> <span th:text="${loan.limit}"></span></p>
                <p><strong>대출 기간:</strong> <span th:text="${loan.period}"></span></p>
                <a th:href="${loan.link}" target="_blank" class="btn btn-primary">자세히 보기</a>
                <p><strong>추천 이유:</strong> <span th:text="${loan.reason}"></span></p>
            </li>
        </ul>
        <div th:if="${#lists.isEmpty(results)} and ${message != null}" class="alert alert-warning mt-3">
            <span th:text="${message}"></span>
    </div>

    <div th:if="${error != null}" class="alert alert-danger mt-3" th:text="${error}"></div>
</div>


<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
