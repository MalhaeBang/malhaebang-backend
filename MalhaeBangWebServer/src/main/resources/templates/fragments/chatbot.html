<div th:fragment="chatbot">
    <button id="chatbotToggle" class="chatbot-toggle-btn" aria-label="chatbot">
        💬
    </button>

    <div id="chatbotPopup" class="chatbot-popup" style="display:none;">
        <button id="chatbotClose" aria-label="chatbot_close">X</button>

        <header class="chatbot-header">
            <img src="/assets/img/malhaebang/logo3d.jpg" alt="로고" class="chatbot-logo" />
            <div class="chatbot-header-text">
                <h1>말해방</h1>
                <p>AI가 바로 답변해 드려요</p>
            </div>
        </header>

        <main class="chatbot-layout">
                <div class="chatbot-main" id="chatWindow">
                <div class="chatbot-main-logo">
                    <img src="/assets/img/malhaebang/logo3d.jpg" alt="큰 로고" />
                </div>

                <div class="tip-box">✅ Tip! 전입신고 + 확정일자를 꼭 받으세요!</div>

                <div class="chat-message bot">🏡 서울 용산구에 월세 150 이하인 집에서 살고 싶어...</div>
                <div class="chat-message bot">💡 조건에 맞는 집을 추천해드릴게요!!!!!!!!!!</div>

                <div class="chat-message user">
                    반려동물 가능한 집으로 필터링해줘.
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" placeholder="조건을 입력해보세요..." />
                <button>전송</button>
            </div>
        </main>
    </div>

    <style>
        .chatbot-toggle-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #2b6bed;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            border: none;
            cursor: pointer;
            color: white;
            font-size: 28px;
            z-index: 1000;
        }

        .chatbot-popup {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 425px;
            height: 570px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 3px 20px rgba(0,0,0,0.3);
            z-index: 1100;
            display: flex;
            flex-direction: column;
        }

        .chatbot-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            background-color: #fff;
            flex-shrink: 0;
        }

        .chatbot-logo {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .chatbot-header-text h1 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 700;
            color: #3a3a3a;
        }

        .chatbot-header-text p {
            margin: 0;
            font-size: 0.875rem;
            color: #888;
        }

        main.chatbot-layout {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column; /* 기존: row → column 으로 변경 */
            height: 100%;
            padding-top: 0 !important;
            margin-top: 0 !important;
            overflow: hidden;     /* ✅ 여기선 스크롤 안 주는 게 맞음 */
        }

        .chatbot-main {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 5px;
            display: flex;
            flex-direction: column;
            min-height: 0; /* ❗ 핵심: 스크롤 허용 */
        }

        .chatbot-main-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .chatbot-main-logo img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .chat-message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            border: 1px solid #ccc;
            color: #000;
            margin-bottom: 5px;
        }

        .chat-message.bot {
            align-self: flex-start;
            background-color: #ffffff;
            border-color: #ccc;
        }

        .chat-message.user {
            align-self: flex-end;
            background-color: #d0e8ff;
            border-color: #8ecaff;
        }

        .chat-input-area {
            flex-shrink: 0;
            display: flex;
            gap: 10px;
            padding: 10px;
            border-top: 1px solid #eee;
            background-color: white;
        }

        .chat-input-area input {
            flex-grow: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .chat-input-area button {
            background-color: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 14px;
        }

        #chatbotClose {
            position: absolute;
            top: 5px;
            right: 10px;
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
            z-index: 1200;
        }

        .tip-box {
            font-size: 14px;
            color: #222;
            margin: 10px 0;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggleBtn = document.getElementById('chatbotToggle');
            const popup = document.getElementById('chatbotPopup');
            const closeBtn = document.getElementById('chatbotClose');
            const chatWindow = document.getElementById("chatWindow");

            const inputField = popup.querySelector(".chat-input-area input");
            const sendButton = popup.querySelector(".chat-input-area button");

            toggleBtn.addEventListener('click', () => {
                popup.style.display = 'block';
                toggleBtn.style.display = 'none';
            });

            closeBtn.addEventListener('click', () => {
                popup.style.display = 'none';
                toggleBtn.style.display = 'block';
            });

            sendButton.addEventListener("click", () => {
                const query = inputField.value.trim();
                if (!query) return;

                const userMessage = document.createElement("div");
                userMessage.className = "chat-message user";
                userMessage.textContent = query;
                chatWindow.appendChild(userMessage);
                inputField.value = "";

                fetch("http://localhost:8000/query", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query })
                })
                    .then(res => res.json())
                    .then(data => {
                        const botMessage = document.createElement("div");
                        botMessage.className = "chat-message bot";
                        botMessage.textContent = data.response;
                        chatWindow.appendChild(botMessage);
                        chatWindow.scrollTop = chatWindow.scrollHeight; // 자동 스크롤
                    })
                    .catch(err => {
                        const errorMessage = document.createElement("div");
                        errorMessage.className = "chat-message bot";
                        errorMessage.textContent = "⚠️ 서버 연결에 실패했습니다.";
                        chatWindow.appendChild(errorMessage);
                        console.error("Error:", err);
                    });
            });

            inputField.addEventListener("keydown", function (event) {
                if (event.isComposing) return;
                if (event.key === "Enter") {
                    event.preventDefault();
                    sendButton.click();
                }
            });
        });
    </script>
</div>
