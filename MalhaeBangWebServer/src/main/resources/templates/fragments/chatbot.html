<div th:fragment="chatbot">
    <button id="chatbotToggle" class="chatbot-toggle-btn" aria-label="chatbot">
        <img src="/assets/img/malhaebang/logo_low.png" alt="챗봇 아이콘" class="chatbot-logo">
    </button>
    <div id="chatbotPopup" class="chatbot-popup">

        <header class="chatbot-header">
            <img src="/assets/img/malhaebang/logo3d.jpg" alt="로고" class="chatbot-logo" />
            <div class="chatbot-header-text">
                <h1>말해방</h1>
                <p>AI가 바로 답변해 드려요</p>
            </div>
            <button id="chatbotClose" class="chatbot-close-btn">×</button>
        </header>

        <main class="chatbot-layout">
            <div class="chatbot-main" id="chatWindow">
                <div class="chat-message bot">👤 서울 용산구에 월세 150 이하인 집에서 살고 싶어</div>
                <div class="chat-message bot">🤖 조건을 입력하시면 추천해드릴게요!</div>
                <div class="chat-message user">노량진 전세 1억 이하, 주차 가능한 집 찾아줘.</div>
            </div>

            <div class="chat-input-area">
                <input type="text" placeholder="조건을 자세하게 입력해주세요." />
                <button>전송</button>
            </div>
        </main>

        <div class="chat-tip">✅ Tip! 전입신고 + 확정일자를 꼭 받으세요!</div>
    </div>

    <style>
        .chatbot-toggle-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            z-index: 9999;
        }

        .chatbot-logo {
            width: 48px;
            height: 48px;
        }

        .chatbot-popup {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 420px;
            height: 600px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 3px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            z-index: 1100;
            overflow: hidden;

            /* 애니메이션 효과용 초기 상태 */
            transform: scale(0.8);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease-in-out;
        }

        .chatbot-popup.show {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .chatbot-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            background-color: #fff;
        }

        .chatbot-header-text h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .chatbot-header-text p {
            margin: 0;
            font-size: 0.85rem;
            color: #666;
        }

        .chatbot-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 5px 16px !important;;
            overflow: hidden;
        }

        .chatbot-main {
            background-image: url('/assets/img/malhaebang/logo3d.jpg');
            background-size: 300px auto;
            background-repeat: no-repeat;
            background-position: center center;
            /*background-attachment: local;       */

            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-message {
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.4;
            word-break: keep-word;
            white-space: pre-wrap;
            max-width: 85%;
            margin-bottom: 12px;

        }

        .chat-message.bot {
            align-self: flex-start;
            background-color: #f2f2f2;
            color: #333;
        }

        .chat-message.user {
            align-self: flex-end;
            background-color: #111827;
            color: #fff;
        }

        .chat-input-area {
            display: flex;
            padding: 12px 16px;
            border-top: 1px solid #eee;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            border-radius: 20px;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #aaa;
        }

        .chat-input-area button {
            background-color: #111827;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
        }

        .chat-tip {
            font-size: 13px;
            padding: 8px 16px;
            background-color: white;
            border-top: 1px solid #eee;
            color: #222;
            text-align: left;
        }

        .chatbot-close-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .chatbot-close-btn:hover {
            background-color: #f0f0f0;
            color: #333;
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggleBtn = document.getElementById('chatbotToggle');
            const popup = document.getElementById('chatbotPopup');
            const closeBtn = document.getElementById('chatbotClose');
            const chatWindow = document.getElementById("chatWindow");
            const inputField = popup.querySelector(".chat-input-area input");
            const sendButton = popup.querySelector(".chat-input-area button");

            // ✅ [1] 토글 버튼으로 열기/닫기
            toggleBtn.addEventListener('click', () => {
                popup.classList.toggle('show');
            });

            // ✅ [2] X 버튼으로 닫기
            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    popup.classList.remove('show');
                });
            }

            // ✅ [3] 메시지 전송
            sendButton.addEventListener("click", () => {
                const query = inputField.value.trim();
                if (!query) return;

                const userMessage = document.createElement("div");
                userMessage.className = "chat-message user";
                userMessage.textContent = query;
                chatWindow.appendChild(userMessage);
                inputField.value = "";
                chatWindow.scrollTop = chatWindow.scrollHeight;

                fetch("http://localhost:8000/query", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query })
                })
                    .then(res => res.json())
                    .then(data => {
                        const botMessage = document.createElement("div");
                        botMessage.className = "chat-message bot";
                        botMessage.textContent = data.response;
                        chatWindow.appendChild(botMessage);
                        chatWindow.scrollTop = chatWindow.scrollHeight;
                    })
                    .catch(() => {
                        const errorMessage = document.createElement("div");
                        errorMessage.className = "chat-message bot";
                        errorMessage.textContent = "⚠️ 서버 연결에 실패했습니다.";
                        chatWindow.appendChild(errorMessage);
                        chatWindow.scrollTop = chatWindow.scrollHeight;
                    });
            });

            // ✅ [4] Enter 키로 전송
            inputField.addEventListener("keydown", function (event) {
                if (event.key === "Enter" && !event.isComposing) {
                    event.preventDefault();
                    sendButton.click();
                }
            });
        });
    </script>
</div>
