<head>
    <meta charset="utf-8" />

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        main.chatbot-layout {
            display: flex;
            height: 100%;
            flex-direction: row;
            background: #e3f0ff; /* 연한 하늘색 단색 */
            /* min-width: 100vw; 최소 너비 보장 */
        }

        .sidebar {
            width: 280px;
            min-width: 280px;
            max-width: 280px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.1);
            flex-shrink: 0; /* 사이드바 크기 고정 */
        }

        .listing-card {
            background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 16px;
            padding: 18px;
            box-shadow:
                    0 8px 32px rgba(0, 0, 0, 0.1),
                    0 2px 8px rgba(0, 0, 0, 0.05),
                    inset 0 1px 0 rgba(255, 255, 255, 0.8);
            font-size: 14px;
            color: #2d3748;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            overflow: hidden;
            word-wrap: break-word;
            word-break: break-word;
        }

        .listing-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .listing-card:hover {
            transform: translateY(-2px);
            box-shadow:
                    0 12px 40px rgba(0, 0, 0, 0.15),
                    0 4px 12px rgba(0, 0, 0, 0.1),
                    inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .listing-card:hover::before {
            opacity: 1;
        }

        .listing-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .favorite-toggle {
            color: #cbd5e0;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 18px;
        }

        .favorite-toggle:hover {
            color: #fbbf24;
            transform: scale(1.1);
        }

        .favorite-toggle.active {
            color: #fbbf24;
        }

        .chatbot-main {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            padding-left: 12px;
            padding-right: 12px;
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(20px);
            padding: 30px;
            position: relative;
            z-index: 2;
        }
        .chatbot-main::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 340px;
            height: 340px;
            background: url('/assets/img/malhaebang/logo3d.jpg') no-repeat center center;
            background-size: contain;
            opacity: 0.18;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }
        .chat-display {
            flex-grow: 1;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow:
                    0 20px 60px rgba(0, 0, 0, 0.1),
                    0 8px 20px rgba(0, 0, 0, 0.05),
                    inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            min-width: 0; /* 내용이 넘칠 때 줄바꿈되도록 */
        }

        .chat-display::-webkit-scrollbar {
            width: 6px;
        }

        .chat-display::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 3px;
        }

        .chat-display::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        .chat-message {
            max-width: 70%;
            padding: 14px 22px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.6;
            position: relative;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: inline-block;
            word-break: break-word;
        }

        .chat-message.user {
            background: #0E1D33;
            color: #fff;
            align-self: flex-end;
            border-radius: 18px 18px 6px 18px;
            box-shadow: 0 4px 16px rgba(14,29,51,0.13);
        }

        .chat-message.user::after {
            content: '';
            position: absolute;
            right: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 12px solid #0E1D33;
        }

        .chat-message.bot {
            background: #fff;
            color: #22223b;
            border: 1.5px solid #d1d5db;
            border-radius: 18px 18px 18px 6px;
            align-self: flex-start;
            box-shadow: 0 4px 16px rgba(0,0,0,0.07);
        }

        .chat-message.bot::after {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-right: 12px solid #fff;
            filter: drop-shadow(-1px 0 0 #d1d5db);
        }

        .chat-input-area {
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            background: #fff;
            padding: 18px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input-area input {
            border-radius: 12px;
            border: 1px solid #d1d5db;
            padding: 14px 18px;
            font-size: 16px;
            flex: 1;
        }

        .chat-input-area button {
            background: #0E1D33;
            color: #fff;
            border-radius: 12px;
            padding: 14px 28px;
            font-weight: bold;
            border: none;
            margin-left: 8px;
            font-size: 16px;
            transition: background 0.2s;
        }

        .chat-input-area button:hover {
            background: #233a5e;
        }

        .tip-box {
            font-size: 14px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(5, 150, 105, 0.1) 100%);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            margin-bottom: 8px;
            border-left: 4px solid #10b981;
            border-radius: 12px;
            color: #065f46;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            animation: tipSlide 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes tipSlide {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .sidebar {
                width: 260px;
                min-width: 260px;
                max-width: 260px;
                padding: 15px;
            }


            .chat-message {
                max-width: 85%;
                padding: 12px 16px;
            }
        }
    </style>
</head>

    <!-- 메인 -->
    <div class="chatbot-main">
        <div class="chat-display" id="chatWindow">
            <div class="tip-box">
                ✅ Tip! 낮에 방문하여 채광 & 환기를 꼭 확인해보세요!
            </div>
            <div class="tip-box">
                ✅ Tip! 전입신고 + 확정일자를 꼭 받으세요!
            </div>
            <div class="chat-message bot">
                🏡 서울 용산구에 월세 150 이하인 집에서 살고 싶어...
            </div>
            <div class="chat-message bot">
                💡 조건에 맞는 집을 추천해드릴게요!
            </div>
            <div class="chat-message user">
                반려동물 가능한 집으로 필터링해줘.
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" placeholder="위치, 가격, 원하는 옵션 조건 등을 자세하게 입력할 수록 정확한 추천을 받으실 수 있어요." />
            <button>전송</button>
        </div>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const chatWindow = document.getElementById("chatWindow");
        const inputField = document.querySelector(".chat-input-area input");
        const sendButton = document.querySelector(".chat-input-area button");

        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('query');

        if (query) {
            const userMessage = document.createElement("div");
            userMessage.className = "chat-message user";
            userMessage.textContent = decodeURIComponent(query);
            chatWindow.appendChild(userMessage);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            fetch("http://localhost:8000/query", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({query})
            })
                .then(res => res.json())
                .then(data => {
                    console.log("서버 응답:", data.response);
                    const botMessage = document.createElement("div");
                    botMessage.className = "chat-message bot";
                    botMessage.textContent = data.response;
                    chatWindow.appendChild(botMessage);
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                })
                .catch(err => {
                    console.error("fetch 오류:", err);
                    const botMessage = document.createElement("div");
                    botMessage.className = "chat-message bot";
                    botMessage.textContent = "⚠️ 서버 연결에 실패했습니다.";
                    chatWindow.appendChild(botMessage);
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                });
        }

        // 버튼 클릭 시 입력된 값으로 챗봇 응답 요청
        sendButton.addEventListener("click", () => {
            const query = inputField.value.trim();
            if (!query) return;

            // 사용자 메시지 표시
            const userMessage = document.createElement("div");
            userMessage.className = "chat-message user";
            userMessage.textContent = query;
            chatWindow.appendChild(userMessage);
            inputField.value = "";
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // FastAPI로 POST 요청
            fetch("http://localhost:8000/query", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({query})
            })
                .then(res => res.json())
                .then(data => {
                    const botMessage = document.createElement("div");
                    botMessage.className = "chat-message bot";
                    botMessage.textContent = data.response;
                    chatWindow.appendChild(botMessage);
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                })
                .catch(err => {
                    const botMessage = document.createElement("div");
                    botMessage.className = "chat-message bot";
                    botMessage.textContent = "⚠️ 서버 연결에 실패했습니다.";
                    chatWindow.appendChild(botMessage);
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                    console.error("Error:", err);
                });
        });

        inputField.addEventListener("keydown", function (event) {
            if (event.isComposing) return;
            if (event.key === "Enter") {
                event.preventDefault();
                sendButton.click();
            }
        });
    });

    function toggleFavorite(elem) {
        const icon = elem.querySelector("i");

        // 별 아이콘 모양 토글
        icon.classList.toggle("bi-star");
        icon.classList.toggle("bi-star-fill");

        // 색상 적용용 클래스 토글
        elem.classList.toggle("active");
    }
</script>
