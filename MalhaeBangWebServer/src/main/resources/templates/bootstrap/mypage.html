<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Page</title>

    <!-- CSS -->
    <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <link href="/assets/css/main.css" rel="stylesheet" />

    <style>
        body {
            background-color: #ffffff;
            color: #000;
        }

        .mypage-wrapper {
            display: flex;
            padding-top: 100px;
            min-height: 80vh;
        }

        .mypage-sidebar {
            width: 200px;
            padding: 20px;
            border-right: 1px solid #333;
            height: 80vh;

        }

        .mypage-sidebar h2 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        .mypage-sidebar ul {
            list-style: none;
            padding-left: 0;
        }

        .mypage-sidebar li {
            padding: 10px 0;
            cursor: pointer;
            color: #ccc;
            position: relative;
            padding-left: 20px;
        }

        .mypage-sidebar li.active {
            color: #000;
            font-weight: bold;
        }

        .mypage-sidebar li.active::before {
            content: '\25B6';
            position: absolute;
            left: 0;
            color: #aaa;
            font-size: 14px;
        }

        .content-area {
            flex-grow: 1;
            padding: 20px 40px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .favorite-item {
            background: #ffffff;
            border: 2px solid #000;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            color: #000;
            cursor: pointer;
        }

        .favorite-icon {
            color: #3b82f6;
            font-size: 24px;
            margin-right: 10px;
        }

        .favorite-description {
            font-size: 14px;
            color: #444;
        }

        .favorite-details {
            display: none;
            margin-top: 10px;
            font-size: 14px;
            color: #222;
        }

        .favorite-item.expanded .favorite-details {
            display: block;
        }
    </style>
</head>

<body class="index-page">
<!-- Header fragment -->
<div th:replace="header :: header"></div>

<main class="main">
    <div class="container-fluid mypage-wrapper">
        <div class="mypage-sidebar">
            <h2>My page</h2>
            <ul>
                <li class="tab-btn active" data-target="info">기본 정보</li>
                <li class="tab-btn" data-target="favorites">찜 목록</li>
            </ul>
        </div>

        <div class="content-area">
            <!-- 기본 정보 탭 -->
            <div id="info" class="tab-content active">
                <h4 th:text="${user.userNickname.contains('_') ? #strings.substringBefore(user.userNickname, '_') : user.userNickname} + '님, 안녕하세요.'"></h4>                <p th:text="'Email : ' + ${user.userEmail}"></p>
            <!-- 여기에 버튼 조건부 렌더링 -->
                <button class="btn btn-primary btn-change"
                        th:if="${user.loginType.name() == 'FORM'}"
                        onclick="location.href='/changepassword'">
                    비밀번호 변경
                </button>

                <!-- 회원 탈퇴 버튼 -->
                <form th:action="@{/user/delete}" method="post" onsubmit="return confirm('정말로 탈퇴하시겠습니까? 탈퇴 시 모든 정보가 삭제됩니다.');">
                    <button type="submit" class="btn btn-danger mt-3">회원 탈퇴</button>
                </form>
            </div>

            <!-- 찜 목록 탭 -->
            <div id="favorites" class="tab-content">
                <h4 th:text="${user.userNickname.contains('_') ? #strings.substringBefore(user.userNickname, '_') : user.userNickname} + ' 님, 찜하신 매물이예요.'"></h4>

                <div th:each="liked : ${likedFolder}" class="favorite-item" th:if="${liked.house != null}">
                    <div>
                        <i class="bi bi-star-fill favorite-icon"></i>
                        <strong th:text="${liked.house.houseAddress}">매물주소</strong><br>
                        <span class="favorite-description"
                              th:text="'면적: ' + ${liked.house.houseArea} + '㎡ / 가격: ' + ${liked.house.housePrice} + '원'"></span>
                        <div class="favorite-details">
                            <strong>층수:</strong> <span th:text="${liked.house.houseFloor}"></span><br>
                            <strong>관리비:</strong> <span th:text="${liked.house.managementFee} + '만원'"></span><br>
                            <strong>공급면적:</strong> <span th:text="${liked.house.houseArea} + '㎡'"></span><br>
                        </div>
                    </div>
                    <div class="favorite-price" th:text="${liked.house.housePrice} + '원'">가격</div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer fragment -->
<!--<footer th:replace="footer :: footer"></footer>-->

<script>
    // 탭 전환 기능
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const target = btn.getAttribute('data-target');
            tabContents.forEach(tab => {
                tab.classList.remove('active');
                if (tab.id === target) tab.classList.add('active');
            });
        });
    });

    // 상세 정보 토글
    const items = document.querySelectorAll('.favorite-item');
    items.forEach(item => {
        item.addEventListener('click', () => {
            item.classList.toggle('expanded');
        });
    });
</script>
</body>
</html>
