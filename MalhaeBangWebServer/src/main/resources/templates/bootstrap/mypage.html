<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Page</title>
    <link href="assets/img/malhaebang/logo_low.png" rel="icon">
    <link href="assets/img/malhaebang/logo_low.png" rel="apple-touch-icon">

    <!-- CSS -->
    <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <link href="/assets/css/main.css" rel="stylesheet" />

    <style>
        body {
            background-color: #ffffff;
            color: #000;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .mypage-wrapper {
            display: flex;
            min-height: 80vh;
        }

        .mypage-sidebar {
            width: 220px;
            padding: 20px;
            border-right: 1px solid #ddd;
            height: 100%;
        }

        .mypage-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #001f60;
        }

        .mypage-divider {
            border: none;
            border-top: 1px solid #ccc;
            margin: 10px 0 20px 0;
        }

        /* 공통 메뉴 스타일 */
        .mypage-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu-item {
            padding: 12px 16px;
            border-top: 1px solid #eee;
            cursor: pointer;
            font-weight: bold;
            color: #000;
            position: relative;
        }

        .menu-item:first-child {
            border-top: none;
        }

        .menu-item:hover {
            background-color: #f9f9f9;
        }

        .menu-item.active {
            background-color: #f5f5f5;
            border-left: 4px solid #007bff;
            color: #007bff;
        }

        .menu-item.active::before {
            content: none;
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            background-color: #007bff;
            border-radius: 50%;
        }

        /* 폴더 토글 영역 */
        .sidebar-toggle {
            cursor: pointer;
            font-weight: bold;
            color: #111;
            margin-top: 20px;
            padding-left: 10px;
            font-size: 16px;
        }

        .folder-list {
            list-style: none;
            padding-left: 20px;
            margin-top: 10px;
            display: none;
        }

        .folder-list.active {
            display: block;
        }

        .folder-btn {
            padding: 6px 0;
            cursor: pointer;
            color: #555;
            font-size: 14px;
            transition: color 0.2s;
        }

        .folder-btn:hover {
            text-decoration: underline;
            color: #000;
        }

        .content-area {
            flex-grow: 1;
            padding: 30px 40px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .favorite-item {
            background: #ffffff;
            border: 2px solid #000;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            color: #000;
            cursor: pointer;
        }

        .favorite-icon {
            color: #3b82f6;
            font-size: 24px;
            margin-right: 10px;
        }

        .favorite-description {
            font-size: 14px;
            color: #444;
        }

        .favorite-details {
            display: none;
            margin-top: 10px;
            font-size: 14px;
            color: #222;
        }

        .favorite-item.expanded .favorite-details {
            display: block;
        }

        h4 {
            line-height: 1.5 !important;
        }
        h5 {
            line-height: 2.5 !important;
        }
    </style>
</head>

<body class="index-page">
<!-- Header fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="main">
    <div class="container-fluid mypage-wrapper">
        <div class="mypage-sidebar">
            <h2 class="mypage-title">My page</h2>
            <hr class="mypage-divider">
            <ul class="mypage-menu">
                <li class="menu-item tab-btn active" data-target="info">기본 정보</li>
                <li class="menu-item tab-btn" data-target="favorites">찜 목록</li>
            </ul>

            <hr class="mypage-divider"> <!-- 메뉴 하단 구분선 -->

            <ul class="folder-list" id="folderList">
                <li th:each="folder : ${likedFolders}"
                    class="tab-btn folder-btn"
                    th:data-folder-id="${folder.folderId}"
                    th:text="${folder.folderName}">
                </li>
            </ul>
        </div>

        <div class="content-area">
            <!-- 기본 정보 탭 -->
            <div id="info" class="tab-content active">
                <h4 th:text="${user.userNickname.contains('_') ? #strings.substringBefore(user.userNickname, '_') : user.userNickname} + '님, 안녕하세요.'"></h4>                <p th:text="'Email : ' + ${user.userEmail}"></p>
            <!-- 여기에 버튼 조건부 렌더링 -->
                <button class="btn btn-primary btn-change"
                        th:if="${user.loginType.name() == 'FORM'}"
                        onclick="location.href='/changepassword'">
                    비밀번호 변경
                </button>

                <!-- 회원 탈퇴 버튼 -->
                <form th:action="@{/user/delete}" method="post" onsubmit="return confirm('정말로 탈퇴하시겠습니까? 탈퇴 시 모든 정보가 삭제됩니다.');">
                    <button type="submit" class="btn btn-danger mt-3">회원 탈퇴</button>
                </form>
            </div>



            <div id="favorites" class="tab-content">
                <h4 th:text="${user.userNickname.contains('_') ? #strings.substringBefore(user.userNickname, '_') : user.userNickname} + '님, 찜하신 매물이예요.'"></h4>

                <div th:each="folder : ${likedFolders}">
                    <div class="favorite-folder-group"
                         th:attr="data-folder-id=${folder.folderId}"
                         style="display: none;"> <!-- 초기에는 안 보이게 -->

                        <h5 th:text="${folder.folderName}"></h5>

                        <div th:each="liked : ${folder.likedItems}"
                             th:if="${liked.house != null}" class="favorite-item">
                            <div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <i class="bi bi-star-fill favorite-icon"></i>
                                        <strong th:text="${liked.house.title}"></strong><br>
                                    </div>
                                    <div style="color: #1e40af; font-weight: bold;">
                                        <span th:text="${liked.house.price}"></span>
                                    </div>
                                </div>

                                <!-- 주요 설명 -->
                                <div class="favorite-description" style="margin-top: 5px;">
                                    <span th:text="${liked.house.areaSize} + '㎡'"></span><br>
                                    <span th:text="${liked.house.houseFeature}"></span>
                                </div>



                                <div class="favorite-details">
                                    📍 주소: <span th:text="${liked.house.address}"></span><br>
                                    🧭 방향: <span th:text="${liked.house.direction}"></span><br>
                                    🏢 층수: <span th:text="${liked.house.floor}"></span><br>
                                    📦 거래 방식: <span th:text="${liked.house.depositType}"></span><br>
                                    🅿️ 주차: <span th:text="${liked.house.parking}"></span><br>
                                    💡 관리비: <span th:text="${liked.house.mfee} + '만원'"></span><br>
                                    ⏰ 입주 가능일: <span th:text="${liked.house.aFrom}"></span><br>
                                    🧑‍💼 중개사 정보: <span th:text="${liked.house.agentInfo}"></span><br>
                                    📞 중개 수수료: <span th:text="${liked.house.agentComm}"></span><br>
                                    🛏 방 개수: <span th:text="${liked.house.roomsCount}"></span><br>
                                    🧰 옵션: <span th:text="${liked.house.options}"></span><br>
                                    📅 등록일: <span th:text="${liked.house.postedAt}"></span><br>
                                    🏙 지역: <span th:text="${liked.house.gu} + ' ' + ${liked.house.dong}"></span><br>
                                    🏠 건물유형: <span th:text="${liked.house.buildingType}"></span><br>
                                    🏗 준공일: <span th:text="${liked.house.builtDate}"></span><br>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>


<script>
    document.addEventListener("DOMContentLoaded", () => {
        const tabContents = document.querySelectorAll('.tab-content');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const folderBtns = document.querySelectorAll('.folder-btn');
        const folderGroups = document.querySelectorAll('.favorite-folder-group');

        // 탭 버튼 클릭 시 전환
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const target = btn.getAttribute('data-target');
                tabContents.forEach(tab => {
                    tab.classList.remove('active');
                    if (tab.id === target) tab.classList.add('active');
                });
            });
        });

        // 폴더 클릭 시 favorites 탭 + 해당 폴더만 표시
        folderBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                tabContents.forEach(tab => tab.classList.remove('active'));
                document.getElementById('favorites').classList.add('active');

                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const folderId = btn.getAttribute('data-folder-id');
                folderGroups.forEach(group => {
                    group.style.display = (group.getAttribute('data-folder-id') === folderId) ? 'block' : 'none';
                });
            });
        });

        // 상세 정보 토글
        const items = document.querySelectorAll('.favorite-item');
        items.forEach(item => {
            item.addEventListener('click', () => {
                item.classList.toggle('expanded');
            });
        });

        // ✅ 기본 진입 시: 찜 목록 탭과 첫 폴더 활성화
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        const favoritesTab = document.getElementById('favorites');
        if (favoritesTab) favoritesTab.classList.add('active');

        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const favoritesMenu = document.querySelector('.menu-item[data-target="favorites"]');
        if (favoritesMenu) favoritesMenu.classList.add('active');

        const folderList = document.getElementById("folderList");
        if (folderList) folderList.classList.add("active");

        const firstFolderBtn = document.querySelector('.folder-btn');
        if (firstFolderBtn) {
            const folderId = firstFolderBtn.getAttribute('data-folder-id');
            document.querySelectorAll('.favorite-folder-group').forEach(group => {
                group.style.display = (group.getAttribute('data-folder-id') === folderId) ? 'block' : 'none';
            });

            document.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
            firstFolderBtn.classList.add('active');
        }
    });
</script>
<div th:replace="~{fragments/chatbot :: chatbot}"></div>

</body>
</html>
