<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MalhaeBang</title>

    <!-- Vendor CSS -->
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/main.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            color: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main.main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 80px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: #ffffff;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 2px;
            color: #000;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .form-control {
            background: none;
            border: none;
            border-bottom: 1px solid #ccc;
            border-radius: 0;
            padding: 12px 4px;
            font-size: 16px;
            color: #000;
            height: 40px;
        }

        .form-control:focus {
            background: none;
            border-bottom: 2px solid #000;
            box-shadow: none;
            outline: none;
        }

        ::placeholder {
            color: #aaa; /* 연한 회색 */
            opacity: 1; /* 파이어폭스 호환 */
        }

        .btn-login {
            width: 100%;
            background: #000;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            margin-top: 30px;
            border-radius: 12px;
            height: 50px;
        }

        .login-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .login-links a {
            color: #666;
            margin: 0 10px;
            text-decoration: none;
        }

         .logo-title {
             font-family: 'Bebas Neue', sans-serif;
             font-size: 48px;
             font-weight: bold;
             letter-spacing: 1px;
             color: #000;
             text-align: center;
             margin-bottom: 2px;
         }

        .logo-subtitle {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            text-transform: uppercase; /* 대문자 변환 */
            letter-spacing: 2px;
            color: #666;
            text-align: center;
        }

        .social-login-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            text-decoration: none;
            color: #000;
            font-weight: bold;
            font-size: 16px;
        }

        .social-button img {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            border-radius: 4px;
        }

        .social-button:hover {
            background-color: #f7f7f7;
        }

    </style>
</head>

<body class="index-page">

<!-- 헤더 -->
<div th:replace="header :: header"></div>

<main class="main">
    <div class="login-container">

        <!-- 본문 -->
        <h2 class="logo-title">MalHaeBang</h2>
        <h3 class="logo-subtitle">말로 찾는 나만의 공간</h3>
        <form method="post" action="/login">

            <div class="form-group">
                <input type="text" name="username" class="form-control" placeholder="ID" required>
            </div>

            <div class="form-group">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-login">Login</button>

        </form>

        <div class="login-links">
            <a href="/findid">아이디 찾기</a> /
            <a href="/findpassword">비밀번호 찾기</a> /
            <a href="/signup">회원가입</a>
        </div>

        <div class="social-login-buttons mt-4">
            <a href="/oauth2/authorization/naver" class="social-button">
                <img src="assets/img/malhaebang/naver_login.png" alt="네이버 로그인">
                <span>네이버로 로그인</span>
            </a>
            <a href="/oauth2/authorization/kakao" class="social-button">
                <img src="assets/img/malhaebang/kakao_login.png" alt="카카오 로그인">
                <span>카카오로 로그인</span>
            </a>
        </div>

    </div>
</main>

<!-- 푸터 -->
<footer th:replace="footer :: footer"></footer>

<!-- Vendor JS -->
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
