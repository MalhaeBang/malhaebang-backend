{% extends "layout.html" %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">📊 지역별 아파트 전세가격지수 추이</h2>
    
    <!-- 입력 폼 -->
    <form method="POST" class="mb-4">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="region" class="form-label">지역 선택:</label>
                <select class="form-select" name="region" id="region">
                    <option value="">-- 전체 --</option>
                    {% for region in regions %}
                        <option value="{{ region }}" {% if region == selected_region %}selected{% endif %}>{{ region }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="col-md-6 mb-3">
                <label for="label" class="form-label">면적 선택:</label>
                <select class="form-select" name="label" id="label">
                    <option value="">-- 전체 --</option>
                    {% for original_label, converted_label in zipped_labels %}
                        <option value="{{ original_label }}" {% if original_label == selected_label %}selected{% endif %}>
                            {{ converted_label }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- 검색 버튼 -->
        <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg">조건 검색</button>
        </div>
    </form>

    <!-- 조건 선택 안내 메시지 -->
    {% if not selected_region and not selected_label %}
        <div class="alert alert-secondary text-center mt-3" role="alert">
            지역이나 면적을 선택해주세요.
        </div>
    {% endif %}

    <!-- 그래프 -->
    {% if plot_url %}
    <div class="text-center mt-4">
        <img src="data:image/png;base64,{{ plot_url }}" class="img-fluid">
    </div>
    {% endif %}

    <!-- 필터 결과 테이블 -->
    {% if table %}
    <h3 class="mt-5 text-center">필터 결과</h3>
    <div class="table-responsive">
        {{ table | safe }}
    </div>
    {% endif %}
</div>
{% endblock %}
