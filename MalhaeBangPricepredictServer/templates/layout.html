<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "전세 데이터" }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
        }
        .sidebar {
            width: 200px;
            flex-shrink: 0; /* 사이드바 고정 */
            height: 100vh;
            background-color: #f8f9fa;
            padding: 20px;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
            max-width: 1500px; /* 콘텐츠 영역 최대 너비 설정 */
            overflow: auto;
        }
        .sidebar a {
            display: block;
            margin-bottom: 15px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }
        .sidebar a:hover {
            text-decoration: underline;
        }
        table.table {
            table-layout: auto;  /* 내용 기반 너비 */
            width: 100%;
            border-collapse: collapse;
        }

        table.table th, table.table td {
            white-space: nowrap;  /* 줄바꿈 없이 한 줄 표시 */
            padding: 6px 12px;
            text-align: center;
            font-size: 14px;
        }

        table.table td {
            min-width: 80px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h4>메뉴</h4>
        <a href="/">📊 지역별 아파트 전세가격지수 추이</a>
        <a href="/plotly-chart">🤖 전세가격지수 예측</a>
        <a href="/forecast">📝 전세가격지수 비교 보고서</a>
        <a href="/chart">🏠 오피스텔 전월세 가격 추이</a>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
