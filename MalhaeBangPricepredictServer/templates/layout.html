<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "전세 데이터" }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            margin: 0;
            background: linear-gradient(120deg, #f8fafc 0%, #e9ecef 100%);
        }
        .wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            flex-shrink: 0;
            background: #fff;
            padding: 28px 20px 20px 20px;
            box-shadow: 2px 0 8px rgba(0,0,0,0.07);
            border-top-right-radius: 18px;
            border-bottom-right-radius: 18px;
            transition: all 0.3s cubic-bezier(.4,2,.6,1);
        }
        .sidebar.collapsed {
            margin-left: -250px;
        }
        .sidebar h4 {
            font-weight: 700;
            margin-bottom: 30px;
            color: #007bff;
            letter-spacing: 1px;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            color: #495057;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.08rem;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
        }
        .sidebar a:hover {
            background: #e9ecef;
            color: #007bff;
        }
        .sidebar a:not(:last-child) {
            border-bottom: 1px solid #f1f3f5;
        }
        .toggle-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1050;
        }
        .content-wrapper {
            flex-grow: 1;
            padding: 40px 24px 24px 24px;
            overflow-x: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            padding: 36px 32px 32px 32px;
            width: 100%;
            max-width: 900px;
            min-height: 400px;
            margin-top: 24px;
            animation: fadeInCard 0.7s cubic-bezier(.4,2,.6,1);
        }
        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        table.table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table.table th, table.table td {
            padding: 8px 12px;
            text-align: left;
            font-size: 1rem;
            border: 1px solid #dee2e6;
        }
        table.table th {
            background-color: #e9ecef;
            font-weight: bold;
        }
        .table-responsive > .table th, .table-responsive > .table td {
             white-space: normal;
        }
        /* 작은 화면에서 사이드바 숨김 */
        @media (max-width: 767.98px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                z-index: 1040;
                border-radius: 0 18px 18px 0;
                padding-top: 60px;
            }
            .wrapper {
                flex-direction: column;
            }
            .content-wrapper {
                padding-top: 70px;
                padding-left: 8px;
                padding-right: 8px;
            }
            .sidebar.collapsed {
                margin-left: -250px;
            }
            .toggle-btn {
                 display: block;
            }
            .sidebar a {
                color: #333;
                font-size: 1rem;
                padding: 10px 8px;
            }
        }
        @media (min-width: 768px) {
            .sidebar.collapsed {
                 margin-left: 0;
            }
            .toggle-btn {
                 display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 사이드바 토글 버튼 (작은 화면에서만 표시) -->
    <button class="btn btn-primary toggle-btn d-md-none" id="sidebarToggle">
        <i class="bi bi-list"></i>
    </button>

    <div class="wrapper">
        <div class="sidebar" id="sidebar">
            <h4>메뉴</h4>
            <a href="/">📊 지역별 아파트 전세가격지수 추이</a>
            <a href="/plotly-chart">🤖 전세가격지수 예측</a>
            <a href="/forecast">📝 전세가격지수 비교 보고서</a>
            <a href="/chart">🏠 오피스텔 전월세 가격 추이</a>
        </div>
        <div class="content-wrapper">
             <div class="main-card">
                 {% block content %}{% endblock %}
             </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        // 초기 로드 시 작은 화면에서 사이드바 숨김 처리
        if (window.innerWidth < 768) {
             sidebar.classList.add('collapsed');
        }
         // 화면 크기 변경 시 사이드바 상태 조정
        window.addEventListener('resize', () => {
            if (window.innerWidth < 768) {
                sidebar.classList.add('collapsed');
            } else {
                sidebar.classList.remove('collapsed');
            }
        });
    </script>
</body>
</html>
