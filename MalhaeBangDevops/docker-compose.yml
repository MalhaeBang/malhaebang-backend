services:
  mysql:
    image: mysql:8.0
    container_name: malhaebang-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - malhaebang-network

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile-jenkins
    container_name: jenkins
    ports:
      - "9090:8080"
      - "50000:50000"
    user: root
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/home/devops
    networks:
      - malhaebang-network

  malhaebang-web:
    build:
      context: ../MalhaeBangWebServer
      dockerfile: Dockerfile
    container_name: malhaebang-web
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    networks:
      - malhaebang-network

  malhaebang-nlp:
    build:
      context: ../MalhaeBangNlpServer
      dockerfile: Dockerfile
    container_name: malhaebang-nlp
    ports:
      - "8000:8000"
    networks:
      - malhaebang-network

  malhaebang-recommend:
    build:
      context: ../MalhaeBangRecommendServer
      dockerfile: Dockerfile
    container_name: malhaebang-recommend
    ports:
      - "5001:5000"
    networks:
      - malhaebang-network

  malhaebang-pricepredict:
    build:
      context: ../MalhaeBangPricepredictServer
      dockerfile: Dockerfile
    container_name: malhaebang-pricepredict
    ports:
      - "5002:5000"
    networks:
      - malhaebang-network


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - malhaebang-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - malhaebang-network

networks:
  malhaebang-network:
volumes:
  jenkins_home:
  mysql_data:
  es_data: