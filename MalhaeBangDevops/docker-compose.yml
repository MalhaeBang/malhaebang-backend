version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: malhaebang-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - malhaebang-network

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile-jenkins
    container_name: jenkins
    ports:
      - "9090:8080"
      - "50000:50000"
    user: root
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/home/devops
    networks:
      - malhaebang-network

  malhaebang-web:
    build:
      context: ../MalhaeBangWebServer
      dockerfile: Dockerfile
    container_name: malhaebang-web
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    networks:
      - malhaebang-network


networks:
  malhaebang-network:

volumes:
  jenkins_home:
  mysql_data: